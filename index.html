<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: "STKaiti", "KaiTi", cursive, serif;
            background-color: #000; 
        }

        /* ---------------- 1. Loading 界面 ---------------- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(20, 16, 14, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        .loading-box {
            width: 260px;
            padding: 24px;
            background: #fdfbf7;
            border: 3px solid #5a7247;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .loading-title {
            color: #4a3e3d;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }

        .progress-bar-container {
            width: 100%;
            height: 16px;
            background-color: #e8e2d5;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #c8beab;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(45deg, #5a7247 25%, #8ba870 25%, #8ba870 50%, #5a7247 50%, #5a7247 75%, #8ba870 75%, #8ba870);
            background-size: 30px 30px;
            border-radius: 10px;
            transition: width 0.2s ease;
            animation: moveStripes 1s linear infinite;
        }

        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 30px 0; }
        }

        .progress-text {
            color: #7a6e65;
            font-size: 13px;
            margin-top: 10px;
            font-weight: bold;
        }

        #start-btn {
            display: none;
            margin-top: 30px;
            padding: 14px 48px;
            background: #e07a5f;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            border: 3px solid #2b1e1a;
            border-radius: 30px;
            box-shadow: 0 6px 0px #2b1e1a, 0 10px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            letter-spacing: 2px;
            transition: transform 0.1s ease;
        }

        #start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #2b1e1a;
        }

        /* ---------------- 2. AR 空间粒子烟花 ---------------- */
        #fireworks-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>

    <!-- 1. Loading 界面 -->
    <div id="loading-screen">
        <div class="loading-box" id="loading-box">
            <div class="loading-title">召唤森林圣坛...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="progress-text" id="progress-text">Loading 0%</div>
        </div>
        <button id="start-btn">开启契约</button>
    </div>

    <!-- 2. 后台音频源 -->
    <video id="audio-source" src="1.mp4" playsinline webkit-playsinline style="display:none;"></video>

    <!-- 3. AR 空间粒子烟花 Canvas -->
    <canvas id="fireworks-canvas"></canvas>

    <!-- 4. 原生 AR 场景：视觉剧场塑造 -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: false; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights: true" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 识别目标点：实体猫头鹰胸针 -->
        <a-entity id="ar-target" mindar-image-target="targetIndex: 0">

            <!-- ==================== 背景第二重：森林圣坛的浮现 ==================== -->
            
            <!-- 两侧及后方生长出的橡树枝桠与苔藓 (左/右/后) -->
            <a-entity id="forest-canopy" visible="false">
                <!-- 左侧维多利亚古木枝桠 -->
                <a-ring position="-0.7 0.2 -0.1" rotation="0 30 0" radius-inner="0.35" radius-outer="0.4" color="#2c3a23" opacity="0.75"
                        animation="property: rotation; to: 0 35 5; dir: alternate; dur: 4000; loop: true; easing: easeInOutSine"></a-ring>
                <!-- 右侧古木枝桠 -->
                <a-ring position="0.7 0.2 -0.1" rotation="0 -30 0" radius-inner="0.35" radius-outer="0.4" color="#2c3a23" opacity="0.75"
                        animation="property: rotation; to: 0 -35 -5; dir: alternate; dur: 4500; loop: true; easing: easeInOutSine"></a-ring>
                
                <!-- 枝桠上的荧光节点（夜光真菌/金蓝光点） -->
                <a-sphere position="-0.5 0.5 0" radius="0.03" color="#64dfdf" opacity="0.9"
                          animation="property: components.material.material.opacity; to: 0.3; dir: alternate; dur: 1200; loop: true"></a-sphere>
                <a-sphere position="0.5 0.4 0" radius="0.025" color="#f7d674" opacity="0.9"
                          animation="property: components.material.material.opacity; to: 0.2; dir: alternate; dur: 1600; loop: true"></a-sphere>
                <a-sphere position="-0.3 -0.1 0.05" radius="0.02" color="#64dfdf" opacity="0.8"
                          animation="property: components.material.material.opacity; to: 0.3; dir: alternate; dur: 1400; loop: true"></a-sphere>
                <a-sphere position="0.4 -0.05 0.05" radius="0.02" color="#f7d674" opacity="0.8"
                          animation="property: components.material.material.opacity; to: 0.2; dir: alternate; dur: 1800; loop: true"></a-sphere>
            </a-entity>

            <!-- 猫头鹰脚下：暗夜水面与金色涟漪 -->
            <a-entity id="water-ripples" position="0 -0.45 0" rotation="-90 0 0" visible="false">
                <!-- 清澈暗夜水面基座 -->
                <a-circle radius="0.6" color="#1a2421" opacity="0.65"></a-circle>
                <!-- 呼吸节奏的金色涟漪 1 -->
                <a-ring radius-inner="0.1" radius-outer="0.12" color="#f7d674" opacity="0.8"
                        animation__expand="property: geometry.radiusOuter; to: 0.58; dur: 3000; loop: true; easing: easeOutQuad"
                        animation__fade="property: components.material.material.opacity; to: 0; dur: 3000; loop: true; easing: easeOutQuad">
                </a-ring>
                <!-- 金色涟漪 2 (错峰交替) -->
                <a-ring radius-inner="0.05" radius-outer="0.07" color="#f7d674" opacity="0.8"
                        animation__expand="property: geometry.radiusOuter; to: 0.58; dur: 3000; delay: 1500; loop: true; easing: easeOutQuad"
                        animation__fade="property: components.material.material.opacity; to: 0; dur: 3000; delay: 1500; loop: true; easing: easeOutQuad">
                </a-ring>
            </a-entity>

            <!-- ==================== 背景第三重：月华与光晕流转 ==================== -->

            <!-- 1. 正后方的微缩满月 -->
            <a-circle id="moon" 
                      position="0 0.2 -0.2" 
                      radius="0.45" 
                      color="#fffcf2" 
                      opacity="0"
                      visible="false">
            </a-circle>

            <!-- 2. 散射梦幻光晕（廷达尔光轴与边缘金光） -->
            <a-ring id="tyndall-halo" 
                    position="0 0.2 -0.18" 
                    radius-inner="0.45" 
                    radius-outer="0.7" 
                    color="#f7d674" 
                    opacity="0"
                    visible="false"
                    animation="property: scale; to: 1.08 1.08 1.08; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine">
            </a-ring>

            <!-- 3. 3D 浮空情绪文字 -->
            <a-text id="ar-text" 
                    value="Happy Everyday" 
                    position="0 0.65 0.1" 
                    align="center" 
                    color="#ffffff" 
                    width="2.6"
                    visible="false"
                    animation="property: position; to: 0 0.7 0.1; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">
            </a-text>

        </a-entity>
    </a-scene>

    <script>
        const loadingScreen = document.querySelector('#loading-screen');
        const loadingBox = document.querySelector('#loading-box');
        const progressBar = document.querySelector('#progress-bar');
        const progressText = document.querySelector('#progress-text');
        const startBtn = document.querySelector('#start-btn');

        const targetEntity = document.querySelector('#ar-target');
        const forestCanopy = document.querySelector('#forest-canopy');
        const waterRipples = document.querySelector('#water-ripples');
        const moon = document.querySelector('#moon');
        const halo = document.querySelector('#tyndall-halo');
        const arText = document.querySelector('#ar-text');
        const mediaSource = document.querySelector('#audio-source');
        const arScene = document.querySelector('a-scene');

        let mindarSystem = null;

        // ---------------- 1. 加载资源 ----------------
        mediaSource.addEventListener('progress', () => {
            if (mediaSource.buffered.length > 0 && mediaSource.duration) {
                const percent = Math.min(100, Math.round((mediaSource.buffered.end(mediaSource.buffered.length - 1) / mediaSource.duration) * 100));
                progressBar.style.width = percent + '%';
                progressText.innerText = `Loading ${percent}%`;
                if (percent >= 100) onReady();
            }
        });

        function onReady() {
            progressBar.style.width = '100%';
            progressText.innerText = 'Ready';
            setTimeout(() => {
                loadingBox.style.display = 'none';
                startBtn.style.display = 'inline-block';
            }, 300);
        }
        setTimeout(onReady, 5000);

        startBtn.addEventListener('click', () => {
            mediaSource.muted = false;
            mediaSource.play().then(() => mediaSource.pause()).catch(e => console.warn(e));

            loadingScreen.style.opacity = '0';
            setTimeout(() => { loadingScreen.style.display = 'none'; }, 800);

            mindarSystem = arScene.systems['mindar-image-system'];
            if (mindarSystem) mindarSystem.start();
        });

        // ---------------- 2. 识别成功：显现三重视觉剧场 ----------------
        targetEntity.addEventListener("targetFound", () => {
            console.log("🎯 捕获猫头鹰胸针！唤醒森林圣坛与月华光晕");

            // 1. 显现 3D 森林枝桠与脚下涟漪水面
            forestCanopy.setAttribute('visible', 'true');
            waterRipples.setAttribute('visible', 'true');

            // 2. 满月与廷达尔光晕淡入（神圣金光）
            moon.setAttribute('visible', 'true');
            moon.setAttribute('animation', 'property: components.material.material.opacity; to: 0.85; dur: 1800; easing: easeOutQuad');
            
            halo.setAttribute('visible', 'true');
            halo.setAttribute('animation__fade', 'property: components.material.material.opacity; to: 0.45; dur: 2200; easing: easeOutQuad');

            // 3. 浮空预言文字
            arText.setAttribute('visible', 'true');

            // 4. 播放音频/背景声
            mediaSource.currentTime = 0;
            mediaSource.muted = false;
            mediaSource.play().catch(e => console.warn(e));
        });

        // 移开镜头时隐藏剧场元素
        targetEntity.addEventListener("targetLost", () => {
            console.log("🔍 离开实体，收起圣坛");
            forestCanopy.setAttribute('visible', 'false');
            waterRipples.setAttribute('visible', 'false');
            moon.setAttribute('visible', 'false');
            halo.setAttribute('visible', 'false');
            arText.setAttribute('visible', 'false');
            mediaSource.pause();
        });

        // ---------------- 3. 播放结束触发粒子烟花 ----------------
        mediaSource.addEventListener('ended', () => {
            createFireworks(window.innerWidth / 2, window.innerHeight * 0.35);
        });

        // ---------------- 4. 空间烟花粒子 ----------------
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createFireworks(x, y) {
            const colors = ['#f7d674', '#e76f51', '#64dfdf', '#e9c46a', '#fffcf2'];
            for (let i = 0; i < 60; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.015,
                    size: Math.random() * 3.5 + 2
                });
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();
    </script>
</body>
</html>
