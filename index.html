<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIMOR LESTE - MindAR Fixed</title>
    <!-- 引入 A-Frame 與 MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: transparent !important; 
        }

        video {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            z-index: -2 !important;
        }

        .a-canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1 !important;
        }
        
        /* 2D UI 懸浮層 */
        .ui-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .ui-container.visible {
            opacity: 1;
        }

        .top-title-container {
            margin-top: 5vh;
            width: 90%;
            text-align: center;
        }

        .top-title {
            font-family: Impact, "Arial Black", sans-serif;
            font-size: 8vw;
            line-height: 0.95;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff3a1 0%, #f7a034 40%, #c43216 80%, #7a1204 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 1px #4a0900;
            filter: drop-shadow(0px 0px 10px rgba(255, 215, 0, 0.8));
        }

        .bottom-actions-container {
            margin-bottom: 4vh;
            width: 92%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: auto;
        }

        .action-btn {
            position: relative;
            width: 31%;
            background: linear-gradient(180deg, #fffef2 0%, #f7e6c4 50%, #e6ca91 100%);
            border: 1.5px solid #d4af37;
            border-radius: 12px;
            padding: 22px 4px 10px 4px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 0 1px 2px #fff;
            cursor: pointer;
        }

        .btn-badge {
            position: absolute;
            top: -16px; left: 50%;
            transform: translateX(-50%);
            width: 32px; height: 32px;
            border-radius: 50%;
            background: radial-gradient(circle, #1a4d2e 0%, #0d2b19 100%);
            border: 2px solid #f3d085;
            display: flex; justify-content: center; align-items: center;
        }

        .btn-badge svg { width: 16px; height: 16px; fill: #f5e2b3; }
        .btn-text { font-family: Georgia, serif; font-size: 2.5vw; font-weight: bold; color: #3b1d06; }

        .scan-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .scan-overlay.hidden { opacity: 0; }
        .scan-box {
            width: 60vw; height: 60vw;
            border: 2px dashed rgba(255, 215, 0, 0.7);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3) inset;
            animation: scanPulse 2s infinite alternate;
        }
        @keyframes scanPulse {
            0% { border-color: rgba(255, 215, 0, 0.4); transform: scale(1); }
            100% { border-color: rgba(255, 215, 0, 1); transform: scale(1.02); }
        }
    </style>

    <script>
        // 安全的長寬比自動校正組件（絕不卡死）
        AFRAME.registerComponent('keep-ratio', {
            schema: { targetWidth: { type: 'number', default: 1.0 } },
            init: function () {
                const el = this.el;
                const src = el.getAttribute('src');
                if (!src) return;

                // 獲取圖片真實路徑或 selector 中的 src
                let imgUrl = src;
                if (src.startsWith('#')) {
                    const imgEl = document.querySelector(src);
                    if (imgEl) imgUrl = imgEl.getAttribute('src');
                }

                // 創建獨立圖片物件靜默加載長寬
                const tempImg = new Image();
                tempImg.src = imgUrl;
                tempImg.onload = () => {
                    const ratio = tempImg.naturalHeight / tempImg.naturalWidth;
                    const w = this.data.targetWidth;
                    const h = w * ratio;
                    // 精確設置比例，零拉伸
                    el.setAttribute('scale', `${w} ${h} 1`);
                };
            }
        });
    </script>
</head>
<body>

    <div class="scan-overlay" id="scanOverlay">
        <div class="scan-box"></div>
    </div>

    <div class="ui-container" id="uiContainer">
        <div class="top-title-container">
            <h1 class="top-title">TIMOR LESTE<br>KOPI LUWAK</h1>
        </div>
        <div class="bottom-actions-container">
            <div class="action-btn" onclick="alert('Flavor Profile clicked!')">
                <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M12 2C8 2 5 5 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-4-3-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>
                <div class="btn-text">Flavor Profile</div>
            </div>
            <div class="action-btn" onclick="alert('Origin Story clicked!')">
                <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h16V9l-8-6zm0 2.75l5 3.75v8.5H7v-8.5l5-3.75z"/></svg></div>
                <div class="btn-text">Origin Story</div>
            </div>
            <div class="action-btn" onclick="alert('Exclusive Gift clicked!')">
                <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M17 8C8 10 59 16.17 3.83 12 12 12 3 7 3 2 3 2 5.03 2 7.5 3.5 10 2 12 2 12 2s1.97 0 4.5 1.5C18.97 2 21 2 21 2c0 5-5 9-9 10zm-5 6c-3.31 0-6 2.69-6 6h12c0-3.31-2.69-6-6-6z"/></svg></div>
                <div class="btn-text">Exclusive Gift</div>
            </div>
        </div>
    </div>

    <!-- MindAR Scene -->
    <a-scene id="arScene" 
             mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.0001; filterBeta: 0.001;" 
             embedded
             color-space="sRGB" 
             renderer="colorManagement: true; transparent: true; alpha: true;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <img id="img1" src="1.png">
            <img id="img2" src="2.png">
            <img id="img3" src="3.png">
            <img id="img4" src="4.png">
            <img id="img5" src="5.png">
            <img id="img6" src="6.png">
            <img id="img7" src="7.png">
            <img id="img9" src="9.png">
            <img id="img10" src="10.png">
            <img id="img11" src="11.png">
            <img id="img12" src="12.png">
            <img id="img13" src="13.png">
            <img id="img14" src="14.png">
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 識別目標 -->
        <a-entity id="arTarget" mindar-image-target="targetIndex: 0">
            
            <!-- 使用 keep-ratio="targetWidth: 數值" 自動適應原圖比例 -->
            
            <!-- 【1. 背景底圖 - Z: 0.01】 -->
            <a-image src="#img7" keep-ratio="targetWidth: 1.1" position="0 -0.05 0.01" rotation="0 0 0.77"></a-image>

            <!-- 【2. 遠景樹木 (左右拉開) - Z: 0.03】 -->
            <a-image src="#img10" keep-ratio="targetWidth: 0.4" position="-0.48 0.18 0.03" rotation="0 0 2.55"></a-image>
            <a-image src="#img11" keep-ratio="targetWidth: 0.58" position="0.52 0.28 0.03" rotation="0 0 -11.45"></a-image>

            <!-- 【3. 中景山丘/植被 - Z: 0.06】 -->
            <a-image src="#img4" keep-ratio="targetWidth: 0.3" position="-0.42 -0.15 0.06" rotation="0 0 0.10"></a-image>
            <a-image src="#img9" keep-ratio="targetWidth: 0.22" position="0.45 -0.12 0.06" rotation="0 0 1.17"></a-image>
            <a-image src="#img2" keep-ratio="targetWidth: 0.45" position="-0.40 -0.32 0.08" rotation="0 0 -10.70"></a-image>
            <a-image src="#img5" keep-ratio="targetWidth: 0.3" position="0.38 -0.25 0.08" rotation="0 0 0.45"></a-image>

            <!-- 【4. 前景點綴與 Banner - Z: 0.11 ~ 0.14】 -->
            <a-image src="#img3" keep-ratio="targetWidth: 0.35" position="-0.38 -0.48 0.11" rotation="0 0 -11.34"></a-image>
            <a-image src="#img6" keep-ratio="targetWidth: 0.38" position="0.38 -0.42 0.11" rotation="0 0 2.36"></a-image>
            <a-image src="#img12" keep-ratio="targetWidth: 0.82" position="0 -0.58 0.13" rotation="0 0 0.87"></a-image>

            <!-- 【5. 核心貓鼬 - Z: 0.16】 -->
            <a-image src="#img1" keep-ratio="targetWidth: 0.55" position="0 -0.28 0.16" rotation="0 0 0.82"
                     animation="property: position; to: 0 -0.26 0.17; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine"></a-image>

            <!-- 【6. 空中飛鳥 - Z: 0.20】 -->
            <a-image src="#img13" keep-ratio="targetWidth: 0.28" position="0.48 0.55 0.20" rotation="0 0 9.84"
                     animation="property: position; to: 0.50 0.58 0.22; dir: alternate; dur: 2500; loop: true; easing: easeInOutQuad"></a-image>
            <a-image src="#img14" keep-ratio="targetWidth: 0.24" position="-0.42 0.45 0.20" rotation="0 0 -11.04"
                     animation="property: position; to: -0.40 0.48 0.22; dir: alternate; dur: 2800; loop: true; easing: easeInOutQuad"></a-image>
            <a-image src="#img14" keep-ratio="targetWidth: 0.26" position="-0.52 0.65 0.20" rotation="0 0 -3.78"
                     animation="property: position; to: -0.50 0.67 0.22; dir: alternate; dur: 3200; loop: true; easing: easeInOutQuad"></a-image>

        </a-entity>
    </a-scene>

    <script>
        const arScene = document.getElementById("arScene");
        const uiContainer = document.getElementById("uiContainer");
        const scanOverlay = document.getElementById("scanOverlay");

        arScene.addEventListener("arReady", () => {
            console.log("🟢 MindAR 初始化完成！");
            const arTarget = document.getElementById("arTarget");

            arTarget.addEventListener("targetFound", () => {
                uiContainer.classList.add("visible");
                scanOverlay.classList.add("hidden");
            });

            arTarget.addEventListener("targetLost", () => {
                uiContainer.classList.remove("visible");
                scanOverlay.classList.remove("hidden");
            });
        });
    </script>
</body>
</html>
