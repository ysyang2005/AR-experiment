<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: "Ma Shan Zheng", "STKaiti", "KaiTi", "PingFang TC", sans-serif;
            background-color: #2b261f; 
        }

        /* ---------------- 1. Loading & Start 介面 ---------------- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(35, 30, 25, 0.88);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        .loading-box {
            width: 260px;
            padding: 24px;
            background: #fdfbf7;
            border: 3px solid #5a7247;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .loading-title {
            color: #4a3e3d;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }

        .progress-bar-container {
            width: 100%;
            height: 16px;
            background-color: #e8e2d5;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #c8beab;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(
                45deg, 
                #5a7247 25%, #8ba870 25%, 
                #8ba870 50%, #5a7247 50%, 
                #5a7247 75%, #8ba870 75%, 
                #8ba870
            );
            background-size: 30px 30px;
            border-radius: 10px;
            transition: width 0.2s ease;
            animation: moveStripes 1s linear infinite;
        }

        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 30px 0; }
        }

        .progress-text {
            color: #7a6e65;
            font-size: 13px;
            margin-top: 10px;
            font-weight: bold;
        }

        #start-btn {
            display: none;
            margin-top: 30px;
            padding: 14px 48px;
            background: #e07a5f;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            border: 3px solid #2b1e1a;
            border-radius: 30px;
            box-shadow: 0 6px 0px #2b1e1a, 0 10px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            letter-spacing: 2px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            animation: fadeIn 0.6s forwards;
        }

        #start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #2b1e1a;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ---------------- 2. 背景圖層 ---------------- */
        #bg-mask {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('bg_cutout.jpg'); 
            background-size: cover;
            background-position: center;
            pointer-events: none;
            z-index: 10;
        }

        /* 背景缺口補全淡入速度控制 (調整為 2 秒漸顯) */
        #bg-patch {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('1.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
            z-index: 20;
        }
        #bg-patch.filled { opacity: 1; }

        /* ---------------- 3. 卡片佈局 (外框與內播放框) ---------------- */
        /* 核心修改：將 transition 時間改為 2.2 秒，達到「漸漸從 0% 到 100%」的平滑效果 */
        #video-card-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2.2s cubic-bezier(0.25, 1, 0.5, 1); /* 減緩彈出速度 */
        }

        #video-card-wrapper.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 外層卡片框 */
        .outer-card {
            position: relative;
            width: 85vw;
            max-width: 400px;
            background: #fdfbf7;
            padding: 16px;
            padding-bottom: 60px;
            border: 4px solid #4a3e3d;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 15px rgba(90, 114, 71, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        /* 內層視頻播放框區域 */
        .video-box {
            position: relative;
            width: 100%;
            background-color: #000;
            border-radius: 12px;
            border: 2px solid #2b1e1a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-box video {
            width: 100%;
            height: auto;
            max-height: 55vh;
            object-fit: contain;
            display: block;
        }

        /* X 按鈕：位於視頻播放框內部右上角 */
        #close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            background: rgba(43, 30, 26, 0.65);
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(4px);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        #close-btn:active {
            transform: scale(0.9);
            background: rgba(224, 122, 95, 0.9);
        }

        /* 古書法字體區域 */
        #calligraphy-text {
            position: absolute;
            bottom: 16px;
            left: 20px;
            color: #2b1e1a;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 1.5s ease;
            pointer-events: none;
            font-family: "STKaiti", "KaiTi", "Ma Shan Zheng", cursive, serif;
        }

        #calligraphy-text.show {
            opacity: 1;
        }

        /* Next 按鈕：位於外框右下角 */
        #next-btn {
            position: absolute;
            bottom: 12px;
            right: 16px;
            padding: 6px 18px;
            background: #e07a5f;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #2b1e1a;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 3px 0px #2b1e1a;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        #next-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0px #2b1e1a;
        }

        /* ---------------- 4. 煙花 Canvas ---------------- */
        #fireworks-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 50;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
</head>
<body>

    <!-- 1. Loading & Start 介面 -->
    <div id="loading-screen">
        <div class="loading-box" id="loading-box">
            <div class="loading-title">Loading Assets...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="progress-text" id="progress-text">Loading 0%</div>
        </div>
        <button id="start-btn">START</button>
    </div>

    <!-- 2. UI 視覺層 -->
    <div id="bg-mask"></div>
    <div id="bg-patch"></div>

    <!-- 3. 卡片佈局結構 -->
    <div id="video-card-wrapper">
        <div class="outer-card">
            <div class="video-box">
                <div id="close-btn" title="返回掃描">✕</div>
                <video id="card-video" src="1.mp4" playsinline webkit-playsinline></video>
            </div>
            <div id="calligraphy-text">“ Happy everyday ”</div>
            <button id="next-btn">Next</button>
        </div>
    </div>

    <!-- 煙花 Canvas -->
    <canvas id="fireworks-canvas"></canvas>

    <!-- 4. AR 引擎 -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: false; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="ar-target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
        const loadingScreen = document.querySelector('#loading-screen');
        const loadingBox = document.querySelector('#loading-box');
        const progressBar = document.querySelector('#progress-bar');
        const progressText = document.querySelector('#progress-text');
        const startBtn = document.querySelector('#start-btn');

        const targetEntity = document.querySelector('#ar-target');
        const bgPatch = document.querySelector('#bg-patch');
        const videoCardWrapper = document.querySelector('#video-card-wrapper');
        const cardVideo = document.querySelector('#card-video');
        const closeBtn = document.querySelector('#close-btn');
        const nextBtn = document.querySelector('#next-btn');
        const calligraphyText = document.querySelector('#calligraphy-text');
        const arScene = document.querySelector('a-scene');

        let mindarSystem = null;

        // ---------------- 1. 資源加載條 ----------------
        cardVideo.addEventListener('progress', updateBufferProgress);
        cardVideo.addEventListener('canplaythrough', onBufferedComplete);

        function updateBufferProgress() {
            if (cardVideo.buffered.length > 0 && cardVideo.duration) {
                const bufferedEnd = cardVideo.buffered.end(cardVideo.buffered.length - 1);
                const percent = Math.min(100, Math.round((bufferedEnd / cardVideo.duration) * 100));
                
                progressBar.style.width = percent + '%';
                progressText.innerText = `Loading ${percent}%`;

                if (percent >= 100) onBufferedComplete();
            }
        }

        let isReady = false;
        function onBufferedComplete() {
            if (isReady) return;
            isReady = true;

            progressBar.style.width = '100%';
            progressText.innerText = 'Loading 100%';

            setTimeout(() => {
                loadingBox.style.display = 'none';
                startBtn.style.display = 'inline-block';
            }, 500);
        }

        setTimeout(() => { if (!isReady) onBufferedComplete(); }, 8000);

        // 點擊 Start 啟動 AR
        startBtn.addEventListener('click', () => {
            cardVideo.muted = false;
            cardVideo.play().then(() => cardVideo.pause()).catch(e => console.warn(e));

            loadingScreen.style.opacity = '0';
            setTimeout(() => { loadingScreen.style.display = 'none'; }, 800);

            mindarSystem = arScene.systems['mindar-image-system'];
            if (mindarSystem) mindarSystem.start();
        });

        // ---------------- 2. 減緩彈出與淡出邏輯 ----------------
        targetEntity.addEventListener("targetFound", () => {
            console.log("🎯 識別成功！開始緩漸淡入卡片...");

            if (mindarSystem) {
                mindarSystem.stop();
            }

            // 觸發背景與卡片的 2.2 秒漸顯動畫
            bgPatch.classList.add('filled');
            videoCardWrapper.classList.add('active');
            calligraphyText.classList.remove('show');

            // 稍微延遲 300ms 再播放影片，讓視覺在卡片漸漸浮現時更自然
            setTimeout(() => {
                cardVideo.currentTime = 0;
                cardVideo.muted = false;
                
                const playPromise = cardVideo.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        cardVideo.muted = true;
                        cardVideo.currentTime = 0;
                        cardVideo.play();
                    });
                }
            }, 300);
        });

        // ---------------- 3. X 按鈕：點擊淡出關閉並重新掃描 ----------------
        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            console.log("🔄 點擊關閉，漸漸淡出並重啟掃描");

            cardVideo.pause();
            
            // 觸發淡出動畫 (2.2 秒)
            videoCardWrapper.classList.remove('active');
            bgPatch.classList.remove('filled');
            calligraphyText.classList.remove('show');

            // 等待淡出動畫徹底完成後 (2000ms)，重新啟動 AR 相機
            setTimeout(() => {
                if (mindarSystem) {
                    mindarSystem.start();
                }
            }, 2000);
        });

        // ---------------- 4. Next 按鈕：點擊跳轉 1.html ----------------
        nextBtn.addEventListener('click', () => {
            console.log("➡️ 點擊 Next，準備跳轉至 1.html");
            document.body.style.transition = 'opacity 0.8s ease';
            document.body.style.opacity = '0';
            
            setTimeout(() => {
                window.location.href = '1.html';
            }, 800);
        });

        // ---------------- 5. 視頻播放結束事件 ----------------
        cardVideo.addEventListener('ended', () => {
            console.log("🎬 視頻播放完成，顯示書法文字與煙花");
            calligraphyText.classList.add('show');
            createFireworks(window.innerWidth / 2, window.innerHeight / 3);
        });

        // ---------------- 6. Canvas 煙花系統 ----------------
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createFireworks(x, y) {
            const colors = ['#f4a261', '#e76f51', '#2a9d8f', '#e9c46a', '#a8dadc', '#ffb703'];
            for (let i = 0; i < 60; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.015,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();
    </script>
</body>
</html>
