<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-html-shader@0.3.2/dist/aframe-html-shader.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: transparent !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }

        .a-canvas {
            background-color: transparent !important;
        }

        /* 音訊點擊覆蓋層 */
        #audio-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
        }
        
        .overlay-btn {
            background: #007bff;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }

        /* 屏幕固定 HUD 底部按鈕 - 確保點擊交互完美 */
        #hud-buttons {
            position: fixed;
            bottom: calc(3.5% + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 450px;
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 1000;
            pointer-events: auto;
        }

        .action-btn {
            position: relative;
            width: 31%;
            background: linear-gradient(180deg, #fffef2 0%, #f7e6c4 50%, #e6ca91 100%);
            border: 1.5px solid #d4af37;
            box-shadow: 0 0 0 1px #8c681e, 0 4px 8px rgba(0, 0, 0, 0.6), inset 0 1px 2px #ffffff;
            border-radius: 12px;
            padding: 20px 2px 8px 2px;
            text-align: center;
            cursor: pointer;
            overflow: visible;
            animation: buttonPulse 3s infinite alternate ease-in-out;
        }

        .btn-badge {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle, #1a4d2e 0%, #0d2b19 100%);
            border: 2px solid #f3d085;
            box-shadow: 0 0 0 1px #6e4e13, 0 2px 4px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-badge svg { width: 14px; height: 14px; fill: #f5e2b3; }
        .btn-text { font-size: 11px; font-weight: bold; color: #3b1d06; white-space: nowrap; }

        @keyframes buttonPulse {
            0% { box-shadow: 0 0 0 1px #8c681e, 0 4px 8px rgba(0, 0, 0, 0.6); }
            100% { box-shadow: 0 0 0 1px #d4af37, 0 4px 12px rgba(0, 0, 0, 0.8), 0 0 14px rgba(255, 215, 0, 0.9); }
        }
    </style>
</head>
<body>

    <!-- 點擊進入 AR -->
    <div id="audio-overlay">
        <div class="overlay-btn">🔊 點擊螢幕開啟音效並進入 AR</div>
    </div>

    <!-- 屏幕固定 2D 按鈕欄 -->
    <div id="hud-buttons">
        <div class="action-btn">
            <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M12 2C8 2 5 5 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-4-3-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>
            <div class="btn-text">Flavor Profile</div>
        </div>
        <div class="action-btn">
            <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h16V9l-8-6zm0 2.75l5 3.75v8.5H7v-8.5l5-3.75z"/></svg></div>
            <div class="btn-text">Origin Story</div>
        </div>
        <div class="action-btn">
            <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M17 8C8 10 59 16.17 3.83 12 12 12 3 7 3 2 3 2 5.03 2 7.5 3.5 10 2 12 2 12 2s1.97 0 4.5 1.5C18.97 2 21 2 21 2c0 5-5 9-9 10zm-5 6c-3.31 0-6 2.69-6 6h12c0-3.31-2.69-6-6-6z"/></svg></div>
            <div class="btn-text">Exclusive Gift</div>
        </div>
    </div>

    <!-- MindAR 3D 場景：素材直接掛載在 Target 下，實現自然近大遠小 -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;" 
             color-space="sRGB" 
             renderer="colorManagement: true, transparent: true, alpha: true" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
        <a-assets>
            <img id="img1" src="1.png">
            <img id="img2" src="2.png">
            <img id="img3" src="3.png">
            <img id="img4" src="4.png">
            <img id="img5" src="5.png">
            <img id="img6" src="6.png">
            <img id="img7" src="7.png">
            <img id="img9" src="9.png">
            <img id="img10" src="10.png">
            <img id="img11" src="11.png">
            <img id="img12" src="12.png">
            <img id="img13" src="13.png">
            <img id="img14" src="14.png">
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 識別目標：內部所有 Plane 會原生跟隨鏡頭遠近放大縮小 -->
        <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
            
            <!-- 3D 空間素材陣列 (按原圖層比例與 Z 軸深度疊加) -->
            <a-image src="#img7" position="0.01 0.08 0.00" width="2.0" height="1.8" material="transparent: true; alphaTest: 0.1"></a-image>
            <a-image src="#img10" position="-0.65 0.28 0.01" width="1.0" height="0.9" rotation="0 0 2.5" material="transparent: true; alphaTest: 0.1"></a-image>
            <a-image src="#img11" position="0.85 0.48 0.01" width="1.8" height="1.6" rotation="0 0 -11.4" material="transparent: true; alphaTest: 0.1"></a-image>
            <a-image src="#img4" position="-0.65 0.06 0.02" width="0.65" height="0.6" material="transparent: true; alphaTest: 0.1"></a-image>
            <a-image src="#img9" position="0.72 0.08 0.02" width="0.42" height="0.4" material="transparent: true; alphaTest: 0.1"></a-image>
            <a-image src="#img2" position="-0.72 -0.08 0.04" width="1.0" height="0.9" rotation="0 0 -10.7" material="transparent: true; alphaTest: 0.1"></a-image>
            <a-image src="#img5" position="0.55 -0.02 0.05" width="0.6" height="0.55" material="transparent: true; alphaTest: 0.1"></a-image>
            <a-image src="#img3" position="-0.62 -0.18 0.06" width="0.75" height="0.7" rotation="0 0 -11.3" material="transparent: true; alphaTest: 0.1"></a-image>
            <a-image src="#img6" position="0.55 -0.09 0.06" width="0.78" height="0.7" rotation="0 0 2.3" material="transparent: true; alphaTest: 0.1"></a-image>
            <a-image src="#img1" position="-0.21 -0.08 0.08" width="1.25" height="1.1" material="transparent: true; alphaTest: 0.1"></a-image>
            <a-image src="#img13" position="0.72 0.88 0.08" width="0.6" height="0.55" rotation="0 0 9.8" material="transparent: true; alphaTest: 0.1"></a-image>
            <a-image src="#img14" position="-0.65 0.68 0.08" width="0.5" height="0.45" rotation="0 0 -11.0" material="transparent: true; alphaTest: 0.1"></a-image>
            <a-image src="#img14" position="-0.75 0.89 0.08" width="0.52" height="0.48" rotation="0 0 -3.7" material="transparent: true; alphaTest: 0.1"></a-image>
            <a-image src="#img12" position="-0.04 -0.32 0.08" width="1.8" height="1.0" material="transparent: true; alphaTest: 0.1"></a-image>

            <!-- 3D 金色環境光 -->
            <a-entity light="type: point; color: #ffd700; intensity: 1.5; distance: 5" position="0 0 0.5"></a-entity>

        </a-entity>
    </a-scene>

    <script>
        const targetEntity = document.querySelector('#ar-target');
        const audioOverlay = document.querySelector('#audio-overlay');
        const hudButtons = document.querySelector('#hud-buttons');

        audioOverlay.addEventListener('click', () => {
            audioOverlay.style.display = 'none';
        });

        // 識別事件監聽：控制 UI 的顯隱
        targetEntity.addEventListener("targetFound", () => {
            hudButtons.style.display = 'flex';
        });

        targetEntity.addEventListener("targetLost", () => {
            hudButtons.style.display = 'none';
        });
    </script>
</body>
</html>
