<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIMOR LESTE - MindAR 3D Space Fixed</title>
    <!-- 引入 A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- 引入 MindAR A-Frame 專用組件 -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: transparent !important; 
        }

        video {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            z-index: -2 !important;
        }

        .a-canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1 !important;
        }
        
        /* 頂部與底部 2D UI 懸浮層 */
        .ui-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .ui-container.visible {
            opacity: 1;
            pointer-events: none;
        }

        .top-title-container {
            margin-top: 5vh;
            width: 90%;
            text-align: center;
            pointer-events: none;
        }

        .top-title {
            font-family: Impact, "Arial Black", sans-serif;
            font-size: 8vw;
            line-height: 0.95;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff3a1 0%, #f7a034 40%, #c43216 80%, #7a1204 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 1px #4a0900;
            filter: drop-shadow(0px 0px 10px rgba(255, 215, 0, 0.8));
        }

        .bottom-actions-container {
            margin-bottom: 4vh;
            width: 92%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: auto;
        }

        .action-btn {
            position: relative;
            width: 31%;
            background: linear-gradient(180deg, #fffef2 0%, #f7e6c4 50%, #e6ca91 100%);
            border: 1.5px solid #d4af37;
            border-radius: 12px;
            padding: 22px 4px 10px 4px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 0 1px 2px #fff;
            cursor: pointer;
        }

        .btn-badge {
            position: absolute;
            top: -16px; left: 50%;
            transform: translateX(-50%);
            width: 32px; height: 32px;
            border-radius: 50%;
            background: radial-gradient(circle, #1a4d2e 0%, #0d2b19 100%);
            border: 2px solid #f3d085;
            display: flex; justify-content: center; align-items: center;
        }

        .btn-badge svg { width: 16px; height: 16px; fill: #f5e2b3; }
        .btn-text { font-family: Georgia, serif; font-size: 2.5vw; font-weight: bold; color: #3b1d06; }

        /* 掃描提示框 */
        .scan-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .scan-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .scan-box {
            width: 60vw;
            height: 60vw;
            border: 2px dashed rgba(255, 215, 0, 0.7);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3) inset;
            animation: scanPulse 2s infinite alternate;
        }
        @keyframes scanPulse {
            0% { border-color: rgba(255, 215, 0, 0.4); transform: scale(1); }
            100% { border-color: rgba(255, 215, 0, 1); transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <!-- 掃描提示框 -->
    <div class="scan-overlay" id="scanOverlay">
        <div class="scan-box"></div>
    </div>

    <!-- 2D UI 疊加層 -->
    <div class="ui-container" id="uiContainer">
        <div class="top-title-container">
            <h1 class="top-title">TIMOR LESTE<br>KOPI LUWAK</h1>
        </div>
        <div class="bottom-actions-container">
            <div class="action-btn" onclick="alert('Flavor Profile clicked!')">
                <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M12 2C8 2 5 5 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-4-3-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>
                <div class="btn-text">Flavor Profile</div>
            </div>
            <div class="action-btn" onclick="alert('Origin Story clicked!')">
                <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h16V9l-8-6zm0 2.75l5 3.75v8.5H7v-8.5l5-3.75z"/></svg></div>
                <div class="btn-text">Origin Story</div>
            </div>
            <div class="action-btn" onclick="alert('Exclusive Gift clicked!')">
                <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M17 8C8 10 59 16.17 3.83 12 12 12 3 7 3 2 3 2 5.03 2 7.5 3.5 10 2 12 2 12 2s1.97 0 4.5 1.5C18.97 2 21 2 21 2c0 5-5 9-9 10zm-5 6c-3.31 0-6 2.69-6 6h12c0-3.31-2.69-6-6-6z"/></svg></div>
                <div class="btn-text">Exclusive Gift</div>
            </div>
        </div>
    </div>

    <!-- MindAR 3D 場景 -->
    <a-scene id="arScene" 
             mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.0001; filterBeta: 0.001;" 
             embedded
             color-space="sRGB" 
             renderer="colorManagement: true; transparent: true; alpha: true;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <img id="img1" src="1.png">
            <img id="img2" src="2.png">
            <img id="img3" src="3.png">
            <img id="img4" src="4.png">
            <img id="img5" src="5.png">
            <img id="img6" src="6.png">
            <img id="img7" src="7.png">
            <img id="img9" src="9.png">
            <img id="img10" src="10.png">
            <img id="img11" src="11.png">
            <img id="img12" src="12.png">
            <img id="img13" src="13.png">
            <img id="img14" src="14.png">
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 綁定識別目標 (以 1:1 正方形標籤中心點為 0,0,0) -->
        <a-entity id="arTarget" mindar-image-target="targetIndex: 0">
            
            <!-- 【背景遠景層 - Z: 0.01】 -->
            <!-- 7.png 背後大背景 -->
            <a-image src="#img7" position="0.01 -0.12 0.01" scale="1.03 1.03 1" rotation="0 0 0.77"></a-image>
            <!-- 10.png 左側背景棕櫚樹 -->
            <a-image src="#img10" position="-0.33 0.05 0.02" scale="0.52 0.52 1" rotation="0 0 2.55"></a-image>
            <!-- 11.png 右側背景棕櫚樹 -->
            <a-image src="#img11" position="0.44 0.23 0.02" scale="0.93 0.93 1" rotation="0 0 -11.45"></a-image>

            <!-- 【中景山丘與植被層 - Z: 0.05 ~ 0.08】 -->
            <!-- 4.png 左中景植物 -->
            <a-image src="#img4" position="-0.33 -0.15 0.05" scale="0.33 0.33 1" rotation="0 0 0.10"></a-image>
            <!-- 9.png 右中景植物 -->
            <a-image src="#img9" position="0.37 -0.14 0.05" scale="0.22 0.22 1" rotation="0 0 1.17"></a-image>
            <!-- 2.png 左邊山丘/咖啡豆 -->
            <a-image src="#img2" position="-0.37 -0.29 0.07" scale="0.51 0.51 1" rotation="0 0 -10.70"></a-image>
            <!-- 5.png 右邊山丘 -->
            <a-image src="#img5" position="0.28 -0.23 0.07" scale="0.31 0.31 1" rotation="0 0 0.45"></a-image>

            <!-- 【主體與前景層 - Z: 0.10 ~ 0.15】 -->
            <!-- 3.png 左下前方點綴 -->
            <a-image src="#img3" position="-0.31 -0.41 0.10" scale="0.38 0.38 1" rotation="0 0 -11.34"></a-image>
            <!-- 6.png 右下前方點綴 -->
            <a-image src="#img6" position="0.28 -0.32 0.10" scale="0.39 0.39 1" rotation="0 0 2.36"></a-image>
            <!-- 12.png 底部飄帶 Banner -->
            <a-image src="#img12" position="-0.02 -0.56 0.12" scale="0.93 0.35 1" rotation="0 0 0.87"></a-image>
            
            <!-- 1.png 核心貓鼬主體 (輕微呼吸浮動) -->
            <a-image src="#img1" position="-0.11 -0.31 0.15" scale="0.64 0.64 1" rotation="0 0 0.82"
                     animation="property: position; to: -0.11 -0.29 0.16; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine"></a-image>

            <!-- 【空中飛鳥懸浮視差層 - Z: 0.20 ~ 0.25】 -->
            <!-- 13.png 右上飛鳥 -->
            <a-image src="#img13" position="0.37 0.55 0.22" scale="0.31 0.31 1" rotation="0 0 9.84"
                     animation="property: position; to: 0.38 0.58 0.24; dir: alternate; dur: 2500; loop: true; easing: easeInOutQuad"></a-image>
            <!-- 14.png 左上飛鳥1 -->
            <a-image src="#img14" position="-0.33 0.38 0.20" scale="0.25 0.25 1" rotation="0 0 -11.04"
                     animation="property: position; to: -0.31 0.41 0.22; dir: alternate; dur: 2800; loop: true; easing: easeInOutQuad"></a-image>
            <!-- 14.png 左上飛鳥2 -->
            <a-image src="#img14" position="-0.39 0.56 0.20" scale="0.27 0.27 1" rotation="0 0 -3.78"
                     animation="property: position; to: -0.37 0.58 0.22; dir: alternate; dur: 3200; loop: true; easing: easeInOutQuad"></a-image>

        </a-entity>
    </a-scene>

    <script>
        const arScene = document.getElementById("arScene");
        const uiContainer = document.getElementById("uiContainer");
        const scanOverlay = document.getElementById("scanOverlay");

        arScene.addEventListener("arReady", () => {
            console.log("🟢 MindAR 初始化完成，開始監聽識別...");
            const arTarget = document.getElementById("arTarget");

            arTarget.addEventListener("targetFound", () => {
                console.log("🎯 成功識別到標籤！");
                uiContainer.classList.add("visible");
                scanOverlay.classList.add("hidden");
            });

            arTarget.addEventListener("targetLost", () => {
                console.log("❌ 標籤離開畫面");
                uiContainer.classList.remove("visible");
                scanOverlay.classList.remove("hidden");
            });
        });

        arScene.addEventListener("arError", (err) => {
            console.error("🔴 MindAR 初始化錯誤:", err);
        });
    </script>
</body>
</html>
