<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: transparent !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }

        .a-canvas {
            background-color: transparent !important;
        }

        /* 音訊點擊覆蓋層 */
        #audio-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
        }
        
        .overlay-btn {
            background: #007bff;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }

        /* 全屏 UI 覆蓋層 */
        #ar-ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            background: transparent;
        }

        #ar-ui-overlay * {
            pointer-events: auto;
        }

        /* 響應式 Viewport 容器 */
        .responsive-stage {
            position: relative;
            width: 100vw;
            height: 100dvh;
            max-width: 500px;
            overflow: hidden;
            pointer-events: none;
            background: transparent;
        }

        /* 動態金色粒子 Canvas 層 */
        .particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
        }

        /* 頂部藝術標題 */
        .top-title-container {
            position: absolute;
            top: 3.5%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 90%;
            text-align: center;
            pointer-events: none;
        }

        .top-title {
            font-family: Impact, "Arial Black", "Trebuchet MS", sans-serif;
            font-size: 7.5vw;
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff3a1 0%, #f7a034 40%, #c43216 80%, #7a1204 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 1px #4a0900;
            animation: titleGlow 2.5s infinite alternate ease-in-out;
        }

        @keyframes titleGlow {
            0% { filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.8)) drop-shadow(0px 0px 8px rgba(247, 160, 52, 0.5)); }
            100% { filter: drop-shadow(0px 2px 6px rgba(0, 0, 0, 0.9)) drop-shadow(0px 0px 22px rgba(255, 215, 0, 0.95)); }
        }

        /* 底部按鈕欄容器 */
        .bottom-actions-container {
            position: absolute;
            bottom: calc(3.5% + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 25;
        }

        .action-btn {
            position: relative;
            width: 31%;
            background: linear-gradient(180deg, #fffef2 0%, #f7e6c4 50%, #e6ca91 100%);
            border: 1.5px solid #d4af37;
            box-shadow: 0 0 0 1px #8c681e, 0 4px 8px rgba(0, 0, 0, 0.6), inset 0 1px 2px #ffffff;
            border-radius: 12px;
            padding: 20px 2px 8px 2px;
            text-align: center;
            cursor: pointer;
            overflow: visible;
            animation: buttonPulse 3s infinite alternate ease-in-out;
        }

        @keyframes buttonPulse {
            0% { box-shadow: 0 0 0 1px #8c681e, 0 4px 8px rgba(0, 0, 0, 0.6), inset 0 1px 2px #ffffff, 0 0 4px rgba(212, 175, 55, 0.3); }
            100% { box-shadow: 0 0 0 1px #d4af37, 0 4px 12px rgba(0, 0, 0, 0.8), inset 0 1px 4px #ffffff, 0 0 14px rgba(255, 215, 0, 0.9); }
        }

        .btn-badge {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle, #1a4d2e 0%, #0d2b19 100%);
            border: 2px solid #f3d085;
            box-shadow: 0 0 0 1px #6e4e13, 0 2px 4px rgba(0, 0, 0, 0.5), 0 0 8px rgba(243, 208, 133, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .btn-badge svg { width: 14px; height: 14px; fill: #f5e2b3; }
        .btn-text { font-size: 2.3vw; font-weight: bold; color: #3b1d06; white-space: nowrap; }

        @media (min-width: 500px) {
            .top-title { font-size: 38px; }
            .btn-text { font-size: 12px; }
            .action-btn { padding: 22px 4px 10px 4px; }
            .btn-badge { top: -16px; width: 32px; height: 32px; }
            .btn-badge svg { width: 16px; height: 16px; }
        }
    </style>
</head>
<body>

    <!-- 點擊進入 AR 覆蓋頁 -->
    <div id="audio-overlay">
        <div class="overlay-btn">🔊 點擊螢幕開啟音效並進入 AR</div>
    </div>

    <!-- 全屏 2D UI 覆蓋層（標題、按鈕、粒子） -->
    <div id="ar-ui-overlay">
        <div class="responsive-stage" id="stage">
            <canvas id="particleCanvas" class="particles-canvas"></canvas>

            <div class="top-title-container">
                <h1 class="top-title">TIMOR LESTE<br>KOPI LUWAK</h1>
            </div>

            <div class="bottom-actions-container">
                <div class="action-btn">
                    <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M12 2C8 2 5 5 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-4-3-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>
                    <div class="btn-text">Flavor Profile</div>
                </div>
                <div class="action-btn">
                    <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h16V9l-8-6zm0 2.75l5 3.75v8.5H7v-8.5l5-3.75z"/></svg></div>
                    <div class="btn-text">Origin Story</div>
                </div>
                <div class="action-btn">
                    <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M17 8C8 10 59 16.17 3.83 12 12 12 3 7 3 2 3 2 5.03 2 7.5 3.5 10 2 12 2 12 2s1.97 0 4.5 1.5C18.97 2 21 2 21 2c0 5-5 9-9 10zm-5 6c-3.31 0-6 2.69-6 6h12c0-3.31-2.69-6-6-6z"/></svg></div>
                    <div class="btn-text">Exclusive Gift</div>
                </div>
            </div>
        </div>
    </div>

    <!-- MindAR 3D 場景 -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;" 
             color-space="sRGB" 
             renderer="colorManagement: true, transparent: true, alpha: true" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 3D 識別追蹤實體：包含所有轉換後的 PNG 圖層 -->
        <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
            
            <!-- [z-index: 0] 背景基礎圖層 -->
            <a-plane src="7.png" position="0.01 -0.08 0.02" width="1.03" height="0.65" rotation="0 0 0.77" material="transparent: true; alphaTest: 0.1;" render-order="990"></a-plane>
            <a-plane src="10.png" position="-0.33 0.09 0.03" width="0.52" height="0.33" rotation="0 0 2.55" material="transparent: true; alphaTest: 0.1;" render-order="991"></a-plane>
            <a-plane src="11.png" position="0.44 0.26 0.03" width="0.93" height="0.58" rotation="0 0 -11.45" material="transparent: true; alphaTest: 0.1;" render-order="991"></a-plane>

            <!-- [z-index: 2] 中景元素 -->
            <a-plane src="4.png" position="-0.33 -0.09 0.06" width="0.33" height="0.21" rotation="0 0 0.10" scale="0.93 0.93 0.93" material="transparent: true; alphaTest: 0.1;" render-order="992"></a-plane>
            <a-plane src="9.png" position="0.37 -0.08 0.06" width="0.22" height="0.14" rotation="0 0 1.17" scale="0.93 0.93 0.93" material="transparent: true; alphaTest: 0.1;" render-order="992"></a-plane>

            <!-- [z-index: 4 - 6] 主要物體與前景細節層 -->
            <a-plane src="2.png" position="-0.37 -0.22 0.10" width="0.51" height="0.32" rotation="0 0 -10.70" scale="0.89 0.89 0.89" material="transparent: true; alphaTest: 0.1;" render-order="993"></a-plane>
            <a-plane src="5.png" position="0.28 -0.16 0.13" width="0.31" height="0.19" rotation="0 0 0.45" scale="0.86 0.86 0.86" material="transparent: true; alphaTest: 0.1;" render-order="994"></a-plane>
            <a-plane src="3.png" position="-0.31 -0.31 0.16" width="0.38" height="0.24" rotation="0 0 -11.34" scale="0.84 0.84 0.84" material="transparent: true; alphaTest: 0.1;" render-order="995"></a-plane>
            <a-plane src="6.png" position="0.28 -0.22 0.16" width="0.39" height="0.24" rotation="0 0 2.36" scale="0.84 0.84 0.84" material="transparent: true; alphaTest: 0.1;" render-order="995"></a-plane>

            <!-- [z-index: 8] 飛鳥與頂部裝飾元素 -->
            <a-plane src="13.png" position="0.37 0.59 0.20" width="0.31" height="0.19" rotation="0 0 9.84" scale="0.81 0.81 0.81" material="transparent: true; alphaTest: 0.1;" render-order="997"></a-plane>
            <a-plane src="14.png" position="-0.33 0.42 0.20" width="0.25" height="0.16" rotation="0 0 -11.04" scale="0.81 0.81 0.81" material="transparent: true; alphaTest: 0.1;" render-order="997"></a-plane>
            <a-plane src="14.png" position="-0.39 0.60 0.22" width="0.27" height="0.17" rotation="0 0 -3.78" scale="0.79 0.79 0.79" material="transparent: true; alphaTest: 0.1;" render-order="997"></a-plane>

            <!-- 12.png（梯田底圖）：定位於下方 -->
            <a-plane src="12.png" position="0 -0.58 0.12" width="1.85" height="1.0" rotation="0 0 0.87" material="transparent: true; alphaTest: 0.1;" render-order="998"></a-plane>

            <!-- 1.png（麝香貓前景）：定位於最前層 -->
            <a-plane src="1.png" position="0.1 -0.15 0.25" width="1.2" height="0.8" scale="0.82 0.82 0.82" material="transparent: true; alphaTest: 0.1;" render-order="999"></a-plane>

        </a-entity>
    </a-scene>

    <script>
        const targetEntity = document.querySelector('#ar-target');
        const audioOverlay = document.querySelector('#audio-overlay');
        const arUiOverlay = document.querySelector('#ar-ui-overlay');

        audioOverlay.addEventListener('click', () => {
            audioOverlay.style.display = 'none';
        });

        // 識別圖狀態監聽：控制全屏 UI 的顯示與隱藏
        targetEntity.addEventListener("targetFound", () => {
            arUiOverlay.style.display = 'flex';
        });

        targetEntity.addEventListener("targetLost", () => {
            arUiOverlay.style.display = 'none';
        });

        // --- 金色粒子渲染引擎 ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const stage = document.getElementById('stage');

        let width, height;
        function resizeCanvas() {
            width = stage.clientWidth;
            height = stage.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class GoldParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 30;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1.5 + 0.4;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.opacity = Math.random() * 0.8 + 0.2;
                this.pulseSpeed = Math.random() * 0.03 + 0.01;
                this.isSparkle = Math.random() < 0.3;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.opacity += Math.sin(Date.now() * this.pulseSpeed) * 0.015;
                if (this.y < -20 || this.opacity <= 0) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, Math.min(1, this.opacity));
                if (this.isSparkle) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.fillStyle = '#ffe259';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(this.x - this.size * 3.5, this.y); ctx.lineTo(this.x + this.size * 3.5, this.y);
                    ctx.moveTo(this.x, this.y - this.size * 3.5); ctx.lineTo(this.x, this.y + this.size * 3.5);
                    ctx.stroke();
                } else {
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2.5);
                    gradient.addColorStop(0, '#ffffff');
                    gradient.addColorStop(0.3, '#ffd700');
                    gradient.addColorStop(0.7, 'rgba(212, 175, 55, 0.4)');
                    gradient.addColorStop(1, 'rgba(212, 175, 55, 0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        const particles = Array.from({ length: 50 }, () => new GoldParticle());
        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
