<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>

    <a-scene mindar-image="imageTargetSrc: targets.mind; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
        <a-assets>
            <!-- 1. 將 img 替換為 video -->
            <video id="video-resource" 
                   src="1.mp4" 
                   preload="auto" 
                   loop 
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline 
                   muted>
            </video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
            <!-- 2. 將 a-image 改為 a-video -->
            <a-video id="ar-video"
                     src="#video-resource"
                     position="0 0 0" 
                     rotation="90 0 0" 
                     material="shader: flat; transparent: true; side: double;">
            </a-video>
        </a-entity>
    </a-scene>

    <script>
        const targetEntity = document.querySelector('#ar-target');
        const videoResource = document.querySelector('#video-resource');
        const arVideoEntity = document.querySelector('#ar-video');

        const BASE_SIZE = 2;

        function setARVideoRatio() {
            if (videoResource.videoWidth > 0 && videoResource.videoHeight > 0) {
                const width = videoResource.videoWidth;
                const height = videoResource.videoHeight;
                const aspectRatio = width / height;

                console.log(`影片原始尺寸: ${width}x${height}, 比例: ${aspectRatio}`);

                if (aspectRatio >= 1) {
                    // 橫向影片或正方形
                    arVideoEntity.setAttribute('width', BASE_SIZE);
                    arVideoEntity.setAttribute('height', BASE_SIZE / aspectRatio);
                } else {
                    // 直向影片
                    arVideoEntity.setAttribute('width', BASE_SIZE * aspectRatio);
                    arVideoEntity.setAttribute('height', BASE_SIZE);
                }
            }
        }

        // 當影片元數據（長寬高）載入完成後計算長寬比
        if (videoResource.readyState >= 1) {
            setARVideoRatio();
        } else {
            videoResource.addEventListener('loadedmetadata', setARVideoRatio);
        }

        // 3. 觸發 AR 識別時控制影片播放/暫停
        targetEntity.addEventListener("targetFound", event => {
            console.log("🎯 識別成功！開始播放 1.mp4");
            videoResource.play();
        });

        targetEntity.addEventListener("targetLost", event => {
            console.log("❌ 失去識別標籤，暫停影片");
            videoResource.pause();
        });
    </script>
</body>
</html>
