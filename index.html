<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100vw; 
            height: 100vh; 
            height: 100dvh;
            overflow: hidden; 
            background: transparent !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }

        #audio-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
        }
        
        .overlay-btn {
            background: #007bff;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }

        /* 全螢幕 2D 動畫容器 */
        #ar-2d-stage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 1000;
            display: none;
            pointer-events: none;
            overflow: hidden;
        }

        #ar-2d-stage * { pointer-events: auto; }

        /* 圖片通用樣式 */
        .img-layer {
            position: absolute;
            user-select: none;
            pointer-events: none;
            opacity: 0;
            object-fit: contain;
        }

        /* 2D 圖層佈局位置與層級 (基於螢幕中央相對定位) */
        #img-7  { width: 85vw; top: 22%; left: 7.5%; z-index: 10; transform: rotate(0.77deg); }
        #img-10 { width: 45vw; top: 28%; left: 10%;  z-index: 11; transform: rotate(2.55deg); }
        #img-11 { width: 75vw; top: 18%; right: 5%;  z-index: 11; transform: rotate(-11.45deg); }

        #img-4  { width: 30vw; top: 40%; left: 12%;  z-index: 12; transform: rotate(0.1deg); }
        #img-2  { width: 42vw; top: 46%; left: 8%;   z-index: 13; transform: rotate(-10.7deg); }
        #img-3  { width: 32vw; top: 52%; left: 14%;  z-index: 15; transform: rotate(-11.34deg); }

        #img-9  { width: 20vw; top: 40%; right: 12%; z-index: 12; transform: rotate(1.17deg); }
        #img-5  { width: 28vw; top: 47%; right: 15%; z-index: 13; transform: rotate(0.45deg); }
        #img-6  { width: 34vw; top: 53%; right: 10%; z-index: 15; transform: rotate(2.36deg); }

        #img-1  { width: 85vw; top: 28%; left: 7.5%; z-index: 20; }

        #img-13   { width: 28vw; top: 12%; right: 15%; z-index: 18; transform: rotate(9.84deg); }
        #img-14-1 { width: 22vw; top: 16%; left: 15%;  z-index: 18; transform: rotate(-11.04deg); }
        #img-14-2 { width: 24vw; top: 10%; left: 10%;  z-index: 19; transform: rotate(-3.78deg); }

        #img-12 { width: 100vw; bottom: 8%; left: 0%; z-index: 18; transform: rotate(0.87deg); }

        .particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 25;
            pointer-events: none;
        }

        /* 標題與按鈕 UI */
        .top-title-container {
            position: absolute;
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            width: 90%;
            text-align: center;
            pointer-events: none;
            opacity: 0;
        }

        .top-title {
            font-family: Impact, "Arial Black", sans-serif;
            font-size: 8vw;
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff3a1 0%, #f7a034 40%, #c43216 80%, #7a1204 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 1px #4a0900;
            min-height: 2.2em;
        }

        .bottom-actions-container {
            position: absolute;
            bottom: calc(3% + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 35;
        }

        .action-btn {
            position: relative;
            width: 31%;
            background: linear-gradient(180deg, #fffef2 0%, #f7e6c4 50%, #e6ca91 100%);
            border: 1.5px solid #d4af37;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            padding: 20px 2px 8px 2px;
            text-align: center;
            cursor: pointer;
            opacity: 0;
        }

        .btn-badge {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #1a4d2e;
            border: 2px solid #f3d085;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-badge svg { width: 14px; height: 14px; fill: #f5e2b3; }
        .btn-text { font-size: 2.5vw; font-weight: bold; color: #3b1d06; white-space: nowrap; }

        @media (min-width: 500px) {
            .top-title { font-size: 42px; }
            .btn-text { font-size: 13px; }
            .action-btn { padding: 22px 4px 10px 4px; }
        }
    </style>
</head>
<body>

    <div id="audio-overlay">
        <div class="overlay-btn">🔊 點擊螢幕進入 AR 體驗</div>
    </div>

    <!-- 2D 圖層動畫 Stage -->
    <div id="ar-2d-stage">
        <!-- 背景圖層 -->
        <img id="img-7" class="img-layer" src="7.png">
        <img id="img-10" class="img-layer" src="10.png">
        <img id="img-11" class="img-layer" src="11.png">

        <!-- 左側劃入圖層 -->
        <img id="img-4" class="img-layer" src="4.png">
        <img id="img-2" class="img-layer" src="2.png">
        <img id="img-3" class="img-layer" src="3.png">

        <!-- 右側劃入圖層 -->
        <img id="img-9" class="img-layer" src="9.png">
        <img id="img-5" class="img-layer" src="5.png">
        <img id="img-6" class="img-layer" src="6.png">

        <!-- 中央主圖 -->
        <img id="img-1" class="img-layer" src="1.png">

        <!-- 上方飛入圖層 -->
        <img id="img-13" class="img-layer" src="13.png">
        <img id="img-14-1" class="img-layer" src="14.png">
        <img id="img-14-2" class="img-layer" src="14.png">

        <!-- 下方劃入圖層 -->
        <img id="img-12" class="img-layer" src="12.png">

        <!-- 粒子 Canvas -->
        <canvas id="particleCanvas" class="particles-canvas"></canvas>

        <!-- 標題 UI -->
        <div class="top-title-container">
            <h1 class="top-title"></h1>
        </div>

        <!-- 底部按鈕 UI -->
        <div class="bottom-actions-container">
            <div class="action-btn">
                <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M12 2C8 2 5 5 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-4-3-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>
                <div class="btn-text">Flavor Profile</div>
            </div>
            <div class="action-btn">
                <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h16V9l-8-6zm0 2.75l5 3.75v8.5H7v-8.5l5-3.75z"/></svg></div>
                <div class="btn-text">Origin Story</div>
            </div>
            <div class="action-btn">
                <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M17 8C8 10 12 12 12 12s1.97 0 4.5 1.5C18.97 2 21 2 21 2c0 5-5 9-9 10zm-5 6c-3.31 0-6 2.69-6 6h12c0-3.31-2.69-6-6-6z"/></svg></div>
                <div class="btn-text">Exclusive Gift</div>
            </div>
        </div>
    </div>

    <!-- 僅保留 MindAR 鏡頭追蹤 -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; maxTrack: 1;" 
             color-space="sRGB" 
             renderer="colorManagement: true, transparent: true, alpha: true" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="ar-target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
        const targetEntity = document.querySelector('#ar-target');
        const audioOverlay = document.querySelector('#audio-overlay');
        const stage2D = document.querySelector('#ar-2d-stage');
        const titleEl = document.querySelector('.top-title');

        let isParticleActive = false;
        let typewriterTimer = null;

        audioOverlay.addEventListener('click', () => {
            audioOverlay.style.display = 'none';
        });

        // 打字機效果
        function playTypewriterEffect() {
            const fullText = "TIMOR LESTE\nKOPI LUWAK";
            titleEl.innerHTML = "";
            let i = 0;
            if (typewriterTimer) clearInterval(typewriterTimer);
            
            typewriterTimer = setInterval(() => {
                if (i < fullText.length) {
                    const char = fullText.charAt(i);
                    titleEl.innerHTML += char === '\n' ? '<br>' : char;
                    i++;
                } else {
                    clearInterval(typewriterTimer);
                }
            }, 60);
        }

        // GSAP 2D 時間軸
        let tl = gsap.timeline({ paused: true });

        function build2DTimeline() {
            tl.kill();
            tl = gsap.timeline({ paused: true });

            // 重置所有圖層狀態
            gsap.set('.img-layer', { opacity: 0 });
            gsap.set('#img-2, #img-3, #img-4', { x: '-100vw' });
            gsap.set('#img-5, #img-6, #img-9', { x: '100vw' });
            gsap.set('#img-13', { x: '-100vw' });
            gsap.set('#img-14-1, #img-14-2', { x: '100vw' });
            gsap.set('#img-12', { y: '100vh' });
            gsap.set('#img-1', { scale: 0.2 });

            // 1. 7, 10, 11 背景浮現
            tl.to('#img-7, #img-10, #img-11', { duration: 1.2, opacity: 1, ease: 'power1.out' })

            // 2. 2, 3, 4 左側劃入
            .to('#img-2, #img-3, #img-4', { duration: 0.8, x: 0, opacity: 1, ease: 'power2.out', stagger: 0.1 }, "-=0.4")

            // 3. 5, 6, 9 右側劃入
            .to('#img-5, #img-6, #img-9', { duration: 0.8, x: 0, opacity: 1, ease: 'power2.out', stagger: 0.1 }, "-=0.6")

            // 4. 1 主圖彈跳放大放大再回到標準大小
            .to('#img-1', { duration: 0.5, opacity: 1, scale: 1.2, ease: 'back.out(1.7)' })
            .to('#img-1', { duration: 0.4, scale: 1, ease: 'power1.inOut' })

            // 5. 13 (左飛入), 14 (右飛入)
            .to('#img-13', { duration: 0.6, x: 0, opacity: 1, ease: 'power2.out' }, "-=0.2")
            .to('#img-14-1, #img-14-2', { duration: 0.6, x: 0, opacity: 1, ease: 'power2.out', stagger: 0.1 }, "-=0.5")

            // 6. 標題打字機
            .to('.top-title-container', { duration: 0.1, opacity: 1 })
            .add(() => playTypewriterEffect())

            // 7. 12 自下而上劃入
            .to('#img-12', { duration: 0.8, y: 0, opacity: 1, ease: 'power2.out' }, "-=0.2")

            // 8. 底部按鈕
            .fromTo('.action-btn',
                { y: 30, opacity: 0, scale: 0.8 },
                { duration: 0.6, y: 0, opacity: 1, scale: 1, ease: 'back.out(1.5)', stagger: 0.15 },
                "-=0.3"
            )

            // 9. 金色粒子登場
            .add(() => { isParticleActive = true; });
        }

        // 識別圖狀態監聽
        targetEntity.addEventListener("targetFound", () => {
            stage2D.style.display = 'block';
            build2DTimeline();
            tl.restart();
        });

        targetEntity.addEventListener("targetLost", () => {
            stage2D.style.display = 'none';
            tl.pause(0);
            isParticleActive = false;
            if (typewriterTimer) clearInterval(typewriterTimer);
            titleEl.innerHTML = "";
        });

        // --- 金色粒子渲染引擎 ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class GoldParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = -10 - Math.random() * 20;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1.8 + 0.6;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.opacity = Math.random() * 0.8 + 0.2;
                this.pulseSpeed = Math.random() * 0.03 + 0.01;
                this.isSparkle = Math.random() < 0.3;
            }
            update() {
                if (!isParticleActive) return;
                this.y += this.speedY;
                this.x += this.speedX;
                this.opacity += Math.sin(Date.now() * this.pulseSpeed) * 0.015;
                if (this.y > height + 20 || this.opacity <= 0) this.reset();
            }
            draw() {
                if (!isParticleActive) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, Math.min(1, this.opacity));
                if (this.isSparkle) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.fillStyle = '#ffe259';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(this.x - this.size * 3.5, this.y); ctx.lineTo(this.x + this.size * 3.5, this.y);
                    ctx.moveTo(this.x, this.y - this.size * 3.5); ctx.lineTo(this.x, this.y + this.size * 3.5);
                    ctx.stroke();
                } else {
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2.5);
                    gradient.addColorStop(0, '#ffffff');
                    gradient.addColorStop(0.3, '#ffd700');
                    gradient.addColorStop(0.7, 'rgba(212, 175, 55, 0.4)');
                    gradient.addColorStop(1, 'rgba(212, 175, 55, 0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        const particles = Array.from({ length: 65 }, () => new GoldParticle());
        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            if (isParticleActive) {
                particles.forEach(p => { p.update(); p.draw(); });
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
