<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #2b261f; 
        }

        /* ---------------- 1. 吉卜力風格 Loading & Start 介面 ---------------- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(35, 30, 25, 0.88);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        .loading-box {
            width: 260px;
            padding: 24px;
            background: #fdfbf7;
            border: 3px solid #5a7247;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .loading-title {
            color: #4a3e3d;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }

        .progress-bar-container {
            width: 100%;
            height: 16px;
            background-color: #e8e2d5;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #c8beab;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(
                45deg, 
                #5a7247 25%, #8ba870 25%, 
                #8ba870 50%, #5a7247 50%, 
                #5a7247 75%, #8ba870 75%, 
                #8ba870
            );
            background-size: 30px 30px;
            border-radius: 10px;
            transition: width 0.2s ease;
            animation: moveStripes 1s linear infinite;
        }

        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 30px 0; }
        }

        .progress-text {
            color: #7a6e65;
            font-size: 13px;
            margin-top: 10px;
            font-weight: bold;
        }

        #start-btn {
            display: none;
            margin-top: 30px;
            padding: 14px 48px;
            background: #e07a5f;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            border: 3px solid #2b1e1a;
            border-radius: 30px;
            box-shadow: 0 6px 0px #2b1e1a, 0 10px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            letter-spacing: 2px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            animation: fadeIn 0.6s forwards;
        }

        #start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #2b1e1a;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ---------------- 2. 基礎背景 UI ---------------- */
        #bg-mask {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('bg_cutout.jpg'); 
            background-size: cover;
            background-position: center;
            pointer-events: none;
            z-index: 10;
        }

        #bg-patch {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('1.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            pointer-events: none;
            z-index: 20;
        }
        #bg-patch.filled { opacity: 1; }

        /* ---------------- 3. 影片卡片容器 & 右上角關閉按鈕 ---------------- */
        #video-card-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out; /* 緩緩出現/緩緩消失 */
        }

        #video-card-wrapper.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 吉卜力風影片卡片框 */
        .video-card {
            position: relative;
            width: 85vw;
            max-width: 420px;
            max-height: 70vh;
            background: #fdfbf7;
            padding: 12px;
            border: 4px solid #4a3e3d;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 15px rgba(90, 114, 71, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            max-height: 60vh;
            object-fit: contain;
            border-radius: 12px;
            background-color: #000;
        }

        /* 右上角叉叉按鈕 (關閉按鈕) */
        #close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: #e07a5f;
            color: #ffffff;
            border: 3px solid #2b1e1a;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 40;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        #close-btn:active {
            transform: scale(0.9);
            background: #c85f43;
        }

        /* ---------------- 4. 弧形文字與煙花 Canvas ---------------- */
        #curved-text-container {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 120px;
            z-index: 45;
            display: none;
            cursor: pointer;
            text-align: center;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.4));
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bounceIn {
            0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        #fireworks-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body>

    <!-- 1. 吉卜力 Loading & Start 介面 -->
    <div id="loading-screen">
        <div class="loading-box" id="loading-box">
            <div class="loading-title">Loading Assets...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="progress-text" id="progress-text">Loading 0%</div>
        </div>
        <button id="start-btn">START</button>
    </div>

    <!-- 2. UI 視覺層 -->
    <div id="bg-mask"></div>
    <div id="bg-patch"></div>

    <!-- 3. 卡片框與全螢幕影片包覆層 -->
    <div id="video-card-wrapper">
        <!-- 右上角關閉按鈕（叉叉） -->
        <div id="close-btn" title="返回掃描">✕</div>

        <div class="video-card">
            <!-- 播放完畢後浮現的弧形文字 -->
            <div id="curved-text-container">
                <svg viewBox="0 0 500 150" width="100%" height="100%">
                    <path id="curve" fill="transparent" d="M 50,120 A 200,100 0 0,1 450,120" />
                    <text fill="#fefae0" stroke="#3a5a40" stroke-width="3" font-size="42" font-weight="900" font-family="'Comic Sans MS', cursive, sans-serif" letter-spacing="3">
                        <textPath href="#curve" startOffset="50%" text-anchor="middle">
                            Happy everyday
                        </textPath>
                    </text>
                </svg>
            </div>

            <video id="card-video" src="1.mp4" playsinline webkit-playsinline></video>
        </div>
    </div>

    <!-- 煙花 Canvas -->
    <canvas id="fireworks-canvas"></canvas>

    <!-- 4. AR 引擎 -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: false; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="ar-target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
        const loadingScreen = document.querySelector('#loading-screen');
        const loadingBox = document.querySelector('#loading-box');
        const progressBar = document.querySelector('#progress-bar');
        const progressText = document.querySelector('#progress-text');
        const startBtn = document.querySelector('#start-btn');

        const targetEntity = document.querySelector('#ar-target');
        const bgPatch = document.querySelector('#bg-patch');
        const videoCardWrapper = document.querySelector('#video-card-wrapper');
        const cardVideo = document.querySelector('#card-video');
        const closeBtn = document.querySelector('#close-btn');
        const curvedText = document.querySelector('#curved-text-container');
        const arScene = document.querySelector('a-scene');

        let mindarSystem = null;

        // ---------------- 1. 滾動進度條與載入控制 ----------------
        cardVideo.addEventListener('progress', updateBufferProgress);
        cardVideo.addEventListener('canplaythrough', onBufferedComplete);

        function updateBufferProgress() {
            if (cardVideo.buffered.length > 0 && cardVideo.duration) {
                const bufferedEnd = cardVideo.buffered.end(cardVideo.buffered.length - 1);
                const percent = Math.min(100, Math.round((bufferedEnd / cardVideo.duration) * 100));
                
                progressBar.style.width = percent + '%';
                progressText.innerText = `Loading ${percent}%`;

                if (percent >= 100) onBufferedComplete();
            }
        }

        let isReady = false;
        function onBufferedComplete() {
            if (isReady) return;
            isReady = true;

            progressBar.style.width = '100%';
            progressText.innerText = 'Loading 100%';

            setTimeout(() => {
                loadingBox.style.display = 'none';
                startBtn.style.display = 'inline-block';
            }, 500);
        }

        setTimeout(() => { if (!isReady) onBufferedComplete(); }, 8000);

        // 點擊 Start 進入識別
        startBtn.addEventListener('click', () => {
            cardVideo.muted = false;
            cardVideo.play().then(() => cardVideo.pause()).catch(e => console.warn(e));

            loadingScreen.style.opacity = '0';
            setTimeout(() => { loadingScreen.style.display = 'none'; }, 800);

            mindarSystem = arScene.systems['mindar-image-system'];
            if (mindarSystem) mindarSystem.start();
        });

        // ---------------- 2. AR 識別成功邏輯 ----------------
        targetEntity.addEventListener("targetFound", () => {
            console.log("🎯 識別成功！關閉攝像頭，鎖定畫面並彈出卡片");

            // 1. 關閉相機與識別系統（節省效能與發熱）
            if (mindarSystem) {
                mindarSystem.stop();
            }

            // 2. 緩緩補上缺口 (1.jpg)
            bgPatch.classList.add('filled');

            // 3. 顯示卡片框並開始播放影片
            curvedText.style.display = 'none';
            videoCardWrapper.classList.add('active');

            cardVideo.currentTime = 0;
            cardVideo.muted = false;
            
            const playPromise = cardVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    cardVideo.muted = true;
                    cardVideo.currentTime = 0;
                    cardVideo.play();
                });
            }
        });

        // ---------------- 3. 右上角關閉按鈕 (✕)：返回掃描頁面 ----------------
        closeBtn.addEventListener('click', () => {
            console.log("🔄 點擊關閉：緩緩淡出頁面並重啟掃描");

            // 1. 影片暫停
            cardVideo.pause();

            // 2. 緩緩淡出消失當前頁面與缺口背景
            videoCardWrapper.classList.remove('active');
            bgPatch.classList.remove('filled');
            curvedText.style.display = 'none';

            // 3. 待淡出動畫完畢後（1 秒後），重新啟動相機進行 AR 識別
            setTimeout(() => {
                if (mindarSystem) {
                    mindarSystem.start();
                    console.log("📷 相機與 AR 識別已重啟");
                }
            }, 1000);
        });

        // ---------------- 4. 影片播放結束事件 ----------------
        cardVideo.addEventListener('ended', () => {
            console.log("🎬 影片播放完成，顯示 Happy everyday");
            curvedText.style.display = 'block';
            createFireworks(window.innerWidth / 2, window.innerHeight / 3);
        });

        curvedText.addEventListener('click', (e) => {
            createFireworks(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 3);
        });

        // ---------------- 5. Canvas 煙花粒子系統 ----------------
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createFireworks(x, y) {
            const colors = ['#f4a261', '#e76f51', '#2a9d8f', '#e9c46a', '#a8dadc', '#ffb703'];
            for (let i = 0; i < 60; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.015,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();
    </script>
</body>
</html>
