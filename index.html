<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }

        /* 1. 點擊開啟音效提示層 */
        #audio-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
            cursor: pointer;
        }
        .overlay-btn {
            background: #007bff; color: white;
            padding: 15px 30px; border-radius: 30px;
            font-size: 18px; font-weight: bold;
        }

        /* 2. 底層：鏤空背景（請放您去背/扣去掃碼口的圖片 bg_cutout.jpg 或直接用 1.jpg 配合遮罩） */
        #bg-mask {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('bg_cutout.jpg'); 
            background-size: cover;
            background-position: center;
            pointer-events: none;
            z-index: 10;
        }

        /* 3. 中層：完整地圖 1.jpg（識別後緩緩補上缺口） */
        #bg-patch {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('1.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* 1.5秒緩緩補上缺口 */
            pointer-events: none;
            z-index: 20;
        }
        #bg-patch.filled {
            opacity: 1;
        }

        /* 4. 頂層：全螢幕影片 1.mp4 (預設隱藏，待補上缺口後顯示或同步淡入) */
        #full-screen-video {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; /* 讓影片鋪滿整個瀏覽器頁面 */
            opacity: 0;
            transition: opacity 1s ease-in-out;
            pointer-events: none;
            z-index: 30;
        }
        #full-screen-video.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- 解鎖聲音遮罩 -->
    <div id="audio-overlay">
        <div class="overlay-btn">🔊 點擊螢幕開啟音效並進入</div>
    </div>

    <!-- UI 視覺層 -->
    <div id="bg-mask"></div>
    <div id="bg-patch"></div>
    
    <!-- 全螢幕 DOM 影片元件（替代原本 3D 空間的 a-video） -->
    <video id="full-screen-video" src="1.mp4" loop playsinline webkit-playsinline></video>

    <!-- 心智識別引擎（後台運作，僅保留識別觸發功能） -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="ar-target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
        const targetEntity = document.querySelector('#ar-target');
        const audioOverlay = document.querySelector('#audio-overlay');
        const bgPatch = document.querySelector('#bg-patch');
        const fsVideo = document.querySelector('#full-screen-video');

        // 解鎖瀏覽器音訊限制
        audioOverlay.addEventListener('click', () => {
            fsVideo.muted = false;
            fsVideo.play().then(() => {
                fsVideo.pause();
            }).catch(err => console.warn(err));
            audioOverlay.style.display = 'none';
        });

        // 識別成功邏輯
        targetEntity.addEventListener("targetFound", event => {
            console.log("🎯 識別成功！開始執行頁面動畫與播放影片");
            
            // 1. 補上缺口 (淡入完整的 1.jpg)
            bgPatch.classList.add('filled');

            // 2. 播放全螢幕影片並淡入顯示
            fsVideo.muted = false;
            const playPromise = fsVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    fsVideo.muted = true; // 降級為靜音播放
                    fsVideo.play();
                });
            }
            
            // 可選擇讓影片在補口動畫完畢後顯示，或直接同步淡入：
            fsVideo.classList.add('active');
        });

        // 失去識別邏輯
        targetEntity.addEventListener("targetLost", event => {
            console.log("❌ 失去目標");
            
            // 復原為缺口狀態並暫停隱藏影片
            bgPatch.classList.remove('filled');
            fsVideo.classList.remove('active');
            fsVideo.pause();
        });
    </script>
</body>
</html>
