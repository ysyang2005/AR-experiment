<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: "Ma Shan Zheng", "STKaiti", "KaiTi", "PingFang TC", sans-serif;
            background-color: #2b261f; 
        }

        /* ---------------- 1. Loading & Start 介面 ---------------- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(35, 30, 25, 0.88);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        .loading-box {
            width: 260px;
            padding: 24px;
            background: #fdfbf7;
            border: 3px solid #5a7247;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .loading-title {
            color: #4a3e3d;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }

        .progress-bar-container {
            width: 100%;
            height: 16px;
            background-color: #e8e2d5;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #c8beab;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(
                45deg, 
                #5a7247 25%, #8ba870 25%, 
                #8ba870 50%, #5a7247 50%, 
                #5a7247 75%, #8ba870 75%, 
                #8ba870
            );
            background-size: 30px 30px;
            border-radius: 10px;
            transition: width 0.2s ease;
            animation: moveStripes 1s linear infinite;
        }

        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 30px 0; }
        }

        .progress-text {
            color: #7a6e65;
            font-size: 13px;
            margin-top: 10px;
            font-weight: bold;
        }

        #start-btn {
            display: none;
            margin-top: 30px;
            padding: 14px 48px;
            background: #e07a5f;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            border: 3px solid #2b1e1a;
            border-radius: 30px;
            box-shadow: 0 6px 0px #2b1e1a, 0 10px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            letter-spacing: 2px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            animation: fadeIn 0.6s forwards;
        }

        #start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #2b1e1a;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ---------------- 2. 背景与沉浸式 Vignette 滤镜层 ---------------- */
        #bg-mask {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('bg_cutout.jpg'); 
            background-size: cover;
            background-position: center;
            pointer-events: none;
            z-index: 10;
        }

        /* 以猫头鹰为中心，周围现实画面逐渐加深、变暗 */
        #vignette-layer {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 45%, rgba(15, 12, 10, 0.0) 15%, rgba(15, 12, 10, 0.88) 75%);
            backdrop-filter: blur(4px);
            opacity: 0;
            transition: opacity 2.2s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 15;
        }
        #vignette-layer.active {
            opacity: 1;
            pointer-events: auto;
        }

        #bg-patch {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('1.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2.2s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 20;
        }
        #bg-patch.filled { opacity: 1; }

        /* 隐藏无缝播放的视频 */
        #hidden-video {
            display: none;
        }

        /* ---------------- 3. 悬浮交互 UI ---------------- */
        #close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            background: rgba(43, 30, 26, 0.65);
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(4px);
            transition: opacity 1.5s ease, transform 0.2s ease;
        }
        #close-btn.show {
            opacity: 1;
            pointer-events: auto;
        }
        #close-btn:active {
            transform: scale(0.9);
            background: rgba(224, 122, 95, 0.9);
        }

        #calligraphy-text {
            position: fixed;
            bottom: 12vh;
            left: 50%;
            transform: translateX(-50%);
            color: #fdfbf7;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 1.5s ease;
            pointer-events: none;
            z-index: 40;
            white-space: nowrap;
            font-family: "STKaiti", "KaiTi", "Ma Shan Zheng", cursive, serif;
        }
        #calligraphy-text.show {
            opacity: 1;
        }

        #next-btn {
            position: fixed;
            bottom: 4vh;
            right: 20px;
            padding: 8px 22px;
            background: #e07a5f;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #2b1e1a;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 3px 0px #2b1e1a;
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease, transform 0.1s ease, box-shadow 0.1s ease;
        }
        #next-btn.show {
            opacity: 1;
            pointer-events: auto;
        }
        #next-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0px #2b1e1a;
        }

        /* ---------------- 4. 烟花 Canvas ---------------- */
        #fireworks-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 50;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
</head>
<body>

    <!-- 1. Loading & Start 介面 -->
    <div id="loading-screen">
        <div class="loading-box" id="loading-box">
            <div class="loading-title">Loading Assets...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="progress-text" id="progress-text">Loading 0%</div>
        </div>
        <button id="start-btn">START</button>
    </div>

    <!-- 2. UI 视觉层与后台音频/视频 -->
    <div id="bg-mask"></div>
    <div id="vignette-layer"></div>
    <div id="bg-patch"></div>
    
    <video id="hidden-video" src="1.mp4" playsinline webkit-playsinline></video>

    <!-- 3. 悬浮交互 UI（无卡片包裹） -->
    <div id="close-btn" title="返回扫描">✕</div>
    <div id="calligraphy-text">“ Happy everyday ”</div>
    <button id="next-btn">Next</button>

    <!-- 烟花 Canvas -->
    <canvas id="fireworks-canvas"></canvas>

    <!-- 4. AR 引擎 -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: false; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="ar-target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
        const loadingScreen = document.querySelector('#loading-screen');
        const loadingBox = document.querySelector('#loading-box');
        const progressBar = document.querySelector('#progress-bar');
        const progressText = document.querySelector('#progress-text');
        const startBtn = document.querySelector('#start-btn');

        const targetEntity = document.querySelector('#ar-target');
        const bgPatch = document.querySelector('#bg-patch');
        const vignetteLayer = document.querySelector('#vignette-layer');
        const cardVideo = document.querySelector('#hidden-video');
        const closeBtn = document.querySelector('#close-btn');
        const nextBtn = document.querySelector('#next-btn');
        const calligraphyText = document.querySelector('#calligraphy-text');
        const arScene = document.querySelector('a-scene');

        let mindarSystem = null;

        // ---------------- 1. 资源加载条 ----------------
        cardVideo.addEventListener('progress', updateBufferProgress);
        cardVideo.addEventListener('canplaythrough', onBufferedComplete);

        function updateBufferProgress() {
            if (cardVideo.buffered.length > 0 && cardVideo.duration) {
                const bufferedEnd = cardVideo.buffered.end(cardVideo.buffered.length - 1);
                const percent = Math.min(100, Math.round((bufferedEnd / cardVideo.duration) * 100));
                
                progressBar.style.width = percent + '%';
                progressText.innerText = `Loading ${percent}%`;

                if (percent >= 100) onBufferedComplete();
            }
        }

        let isReady = false;
        function onBufferedComplete() {
            if (isReady) return;
            isReady = true;

            progressBar.style.width = '100%';
            progressText.innerText = 'Loading 100%';

            setTimeout(() => {
                loadingBox.style.display = 'none';
                startBtn.style.display = 'inline-block';
            }, 500);
        }

        setTimeout(() => { if (!isReady) onBufferedComplete(); }, 8000);

        // 点击 Start 启动 AR
        startBtn.addEventListener('click', () => {
            cardVideo.muted = false;
            cardVideo.play().then(() => cardVideo.pause()).catch(e => console.warn(e));

            loadingScreen.style.opacity = '0';
            setTimeout(() => { loadingScreen.style.display = 'none'; }, 800);

            mindarSystem = arScene.systems['mindar-image-system'];
            if (mindarSystem) mindarSystem.start();
        });

        // ---------------- 2. 识别成功：暗化四周，聚焦猫头鹰 ----------------
        targetEntity.addEventListener("targetFound", () => {
            console.log("🎯 识别成功！四周画面加深变暗，聚焦猫头鹰...");

            if (mindarSystem) {
                mindarSystem.stop();
            }

            // 平滑启动暗角与关闭按钮
            setTimeout(() => {
                bgPatch.classList.add('filled');
                vignetteLayer.classList.add('active');
                closeBtn.classList.add('show');
                nextBtn.classList.add('show');
            }, 50);

            calligraphyText.classList.remove('show');

            // 播放视频/声音
            setTimeout(() => {
                cardVideo.currentTime = 0;
                cardVideo.muted = false;
                
                const playPromise = cardVideo.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        cardVideo.muted = true;
                        cardVideo.currentTime = 0;
                        cardVideo.play();
                    });
                }
            }, 400);
        });

        // ---------------- 3. X 按钮：淡出暗角并重启相机 ----------------
        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            console.log("🔄 点击关闭，淡出暗角效果");

            cardVideo.pause();
            
            vignetteLayer.classList.remove('active');
            bgPatch.classList.remove('filled');
            closeBtn.classList.remove('show');
            nextBtn.classList.remove('show');
            calligraphyText.classList.remove('show');

            // 等待 2.2 秒淡出动画结束后重启相机
            setTimeout(() => {
                if (mindarSystem) {
                    mindarSystem.start();
                }
            }, 2200);
        });

        // ---------------- 4. Next 按钮：点击跳转 ----------------
        nextBtn.addEventListener('click', () => {
            console.log("➡️ 点击 Next，跳转至 1.html");
            document.body.style.transition = 'opacity 1s ease';
            document.body.style.opacity = '0';
            
            setTimeout(() => {
                window.location.href = '1.html';
            }, 1000);
        });

        // ---------------- 5. 音效/视频播放结束事件 ----------------
        cardVideo.addEventListener('ended', () => {
            console.log("🎬 播放完成，浮现预言文字与烟花");
            calligraphyText.classList.add('show');
            createFireworks(window.innerWidth / 2, window.innerHeight / 3);
        });

        // ---------------- 6. Canvas 烟花系统 ----------------
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createFireworks(x, y) {
            const colors = ['#f4a261', '#e76f51', '#2a9d8f', '#e9c46a', '#a8dadc', '#ffb703'];
            for (let i = 0; i < 60; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.015,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();
    </script>
</body>
</html>
