<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
    </style>

    <script>
        // 註冊遮罩組件：關閉顏色寫入，僅保留深度資訊以遮擋後方物件
        AFRAME.registerComponent('occluder', {
            init: function () {
                const mesh = this.el.getObject3D('mesh');
                if (mesh) {
                    mesh.material.colorWrite = false;
                } else {
                    this.el.addEventListener('model-loaded', () => {
                        this.el.getObject3D('mesh').material.colorWrite = false;
                    });
                }
            }
        });
    </script>
</head>
<body>

    <a-scene mindar-image="imageTargetSrc: targets.mind; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
        <a-assets>
            <img id="img-resource" src="1.png" crossorigin="anonymous">
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
            
            <!-- 1. 貓頭鷹位置的隱形遮罩 (Z = 0) -->
            <!-- 可以調整 width, height 與 position (X Y Z) 來精確匹配圖卡中貓頭鷹的位置與大小 -->
            <a-plane occluder 
                     position="0 0 0" 
                     width="1.0" 
                     height="1.2" 
                     material="shader: flat;">
            </a-plane>

            <!-- 2. 後方的樹枝圖片 (Z = -0.05) -->
            <a-image id="ar-image"
                     src="#img-resource"
                     position="0 0 -0.05" 
                     rotation="0 0 0"
                     material="shader: flat; transparent: true; opacity: 0; side: double;"
                     animation__fadein="property: material.opacity; from: 0; to: 1; dur: 800; easing: easeInOutCubic; startEvents: fade-in"
                     animation__fadeout="property: material.opacity; from: 1; to: 0; dur: 300; easing: easeInOutCubic; startEvents: fade-out">
            </a-image>

        </a-entity>
    </a-scene>

    <script>
        const targetEntity = document.querySelector('#ar-target');
        const imgResource = document.querySelector('#img-resource');
        const arImageEntity = document.querySelector('#ar-image');

        const BASE_SIZE = 2;

        function setARImageRatio() {
            if (imgResource.naturalWidth > 0 && imgResource.naturalHeight > 0) {
                const width = imgResource.naturalWidth;
                const height = imgResource.naturalHeight;
                const aspectRatio = width / height;

                if (aspectRatio >= 1) {
                    arImageEntity.setAttribute('width', BASE_SIZE);
                    arImageEntity.setAttribute('height', BASE_SIZE / aspectRatio);
                } else {
                    arImageEntity.setAttribute('width', BASE_SIZE * aspectRatio);
                    arImageEntity.setAttribute('height', BASE_SIZE);
                }
            }
        }

        if (imgResource.complete) {
            setARImageRatio();
        } else {
            imgResource.addEventListener('load', setARImageRatio);
        }

        targetEntity.addEventListener("targetFound", event => {
            console.log("🎯 識別成功！");
            arImageEntity.emit('fade-in');
        });

        targetEntity.addEventListener("targetLost", event => {
            console.log("❌ 失去識別標籤");
            arImageEntity.emit('fade-out');
        });
    </script>
</body>
</html>
