<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: "STKaiti", "KaiTi", cursive, serif;
            background-color: #000; 
        }

        /* ---------------- 1. Loading & Start 界面 ---------------- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(20, 16, 14, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        .loading-box {
            width: 260px;
            padding: 24px;
            background: #fdfbf7;
            border: 3px solid #5a7247;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .loading-title {
            color: #4a3e3d;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }

        .progress-bar-container {
            width: 100%;
            height: 16px;
            background-color: #e8e2d5;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #c8beab;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(45deg, #5a7247 25%, #8ba870 25%, #8ba870 50%, #5a7247 50%, #5a7247 75%, #8ba870 75%, #8ba870);
            background-size: 30px 30px;
            border-radius: 10px;
            transition: width 0.2s ease;
            animation: moveStripes 1s linear infinite;
        }

        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 30px 0; }
        }

        .progress-text {
            color: #7a6e65;
            font-size: 13px;
            margin-top: 10px;
            font-weight: bold;
        }

        #start-btn {
            display: none;
            margin-top: 30px;
            padding: 14px 48px;
            background: #e07a5f;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            border: 3px solid #2b1e1a;
            border-radius: 30px;
            box-shadow: 0 6px 0px #2b1e1a, 0 10px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            letter-spacing: 2px;
            transition: transform 0.1s ease;
        }

        #start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #2b1e1a;
        }

        /* ---------------- 2. 直接作用于相机的黑夜聚光暗角 ---------------- */
        #ar-vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            /* 中心透明聚焦猫头鹰，四周逐渐加深变暗 */
            background: radial-gradient(circle at 50% 50%, rgba(10, 8, 6, 0.0) 20%, rgba(10, 8, 6, 0.85) 70%);
            backdrop-filter: blur(2px);
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            transition: opacity 2.0s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #ar-vignette.active {
            opacity: 1;
        }

        /* ---------------- 3. AR 空间烟花 Canvas ---------------- */
        #fireworks-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>

    <!-- 1. Loading 界面 -->
    <div id="loading-screen">
        <div class="loading-box" id="loading-box">
            <div class="loading-title">Loading Sanctuary...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="progress-text" id="progress-text">Loading 0%</div>
        </div>
        <button id="start-btn">START</button>
    </div>

    <!-- 2. 相机画面上方的暗角压暗滤镜 -->
    <div id="ar-vignette"></div>

    <!-- 3. 后台播放音频/视频源 -->
    <video id="audio-source" src="1.mp4" playsinline webkit-playsinline style="display:none;"></video>

    <!-- 4. AR 空间粒子烟花 -->
    <canvas id="fireworks-canvas"></canvas>

    <!-- 5. 原生 AR 场景：识别后直接在实体猫头鹰周围叠加 3D 浮空预言 -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: false; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 识别目标点：实体猫头鹰 -->
        <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
            
            <!-- 3D 浮空情绪文字：直接置于猫头鹰正上方 -->
            <a-text id="ar-text" 
                    value="Happy Everyday" 
                    position="0 0.5 0" 
                    align="center" 
                    color="#fdfbf7" 
                    width="2.5"
                    visible="false"
                    animation="property: position; to: 0 0.58 0; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">
            </a-text>

            <!-- 猫头鹰底部的微光光环 -->
            <a-ring id="ar-ring" 
                    position="0 -0.2 0" 
                    rotation="-90 0 0" 
                    radius-inner="0.3" 
                    radius-outer="0.4" 
                    color="#e07a5f" 
                    opacity="0"
                    visible="false">
            </a-ring>

        </a-entity>
    </a-scene>

    <script>
        const loadingScreen = document.querySelector('#loading-screen');
        const loadingBox = document.querySelector('#loading-box');
        const progressBar = document.querySelector('#progress-bar');
        const progressText = document.querySelector('#progress-text');
        const startBtn = document.querySelector('#start-btn');

        const arVignette = document.querySelector('#ar-vignette');
        const targetEntity = document.querySelector('#ar-target');
        const arText = document.querySelector('#ar-text');
        const arRing = document.querySelector('#ar-ring');
        const mediaSource = document.querySelector('#audio-source');
        const arScene = document.querySelector('a-scene');

        let mindarSystem = null;

        // ---------------- 1. 加载资源 ----------------
        mediaSource.addEventListener('progress', () => {
            if (mediaSource.buffered.length > 0 && mediaSource.duration) {
                const percent = Math.min(100, Math.round((mediaSource.buffered.end(mediaSource.buffered.length - 1) / mediaSource.duration) * 100));
                progressBar.style.width = percent + '%';
                progressText.innerText = `Loading ${percent}%`;
                if (percent >= 100) onReady();
            }
        });

        function onReady() {
            progressBar.style.width = '100%';
            progressText.innerText = 'Ready';
            setTimeout(() => {
                loadingBox.style.display = 'none';
                startBtn.style.display = 'inline-block';
            }, 300);
        }
        setTimeout(onReady, 5000);

        startBtn.addEventListener('click', () => {
            mediaSource.muted = false;
            mediaSource.play().then(() => mediaSource.pause()).catch(e => console.warn(e));

            loadingScreen.style.opacity = '0';
            setTimeout(() => { loadingScreen.style.display = 'none'; }, 800);

            mindarSystem = arScene.systems['mindar-image-system'];
            if (mindarSystem) mindarSystem.start();
        });

        // ---------------- 2. 原生 AR 识别：扫码框内直接呈现氛围 ----------------
        targetEntity.addEventListener("targetFound", () => {
            console.log("🎯 在扫码框内捕获猫头鹰！直接渲染氛围");

            // 1. 相机四周加深变暗，聚光在猫头鹰身上
            arVignette.classList.add('active');

            // 2. 显示 AR 3D 浮空元素与底座光环
            arText.setAttribute('visible', 'true');
            arRing.setAttribute('visible', 'true');
            arRing.setAttribute('animation', 'property: components.material.material.opacity; to: 0.6; dur: 1500; easing: easeInOutSine');

            // 3. 播放背景声音/音频
            mediaSource.currentTime = 0;
            mediaSource.muted = false;
            mediaSource.play().catch(e => console.warn(e));
        });

        // 失去焦点时平滑恢复镜头
        targetEntity.addEventListener("targetLost", () => {
            console.log("🔍 离开镜头，恢复普通扫描状态");
            arVignette.classList.remove('active');
            arText.setAttribute('visible', 'false');
            arRing.setAttribute('visible', 'false');
            mediaSource.pause();
        });

        // ---------------- 3. 播放结束触发粒子烟花 ----------------
        mediaSource.addEventListener('ended', () => {
            createFireworks(window.innerWidth / 2, window.innerHeight * 0.4);
        });

        // ---------------- 4. 空间烟花粒子 ----------------
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createFireworks(x, y) {
            const colors = ['#f4a261', '#e76f51', '#2a9d8f', '#e9c46a', '#ffb703'];
            for (let i = 0; i < 50; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.015,
                    size: Math.random() * 3 + 2
                });
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();
    </script>
</body>
</html>
