<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        
        /* 啟動聲音提示浮層 */
        #audio-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            font-family: sans-serif;
        }
        
        .overlay-btn {
            background: #007bff;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 點擊解鎖聲音覆蓋層 -->
    <div id="audio-overlay">
        <div class="overlay-btn">🔊 點擊螢幕開啟音效並進入 AR</div>
    </div>

    <a-scene mindar-image="imageTargetSrc: targets.mind; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
        <a-assets>
            <video id="video-resource" 
                   src="1.mp4" 
                   preload="auto" 
                   loop 
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline>
            </video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
            <a-video id="ar-video"
                     src="#video-resource"
                     position="0 0 0" 
                     rotation="0 0 0" 
                     material="shader: flat; transparent: true; side: double;">
            </a-video>
        </a-entity>
    </a-scene>

    <script>
        const targetEntity = document.querySelector('#ar-target');
        const videoResource = document.querySelector('#video-resource');
        const arVideoEntity = document.querySelector('#ar-video');
        const audioOverlay = document.querySelector('#audio-overlay');

        const BASE_SIZE = 2;
        let isAudioUnlocked = false;

        // 解鎖瀏覽器音訊限制
        function unlockAudio() {
            videoResource.muted = false; // 強制開啟聲音
            // 預先 play & pause 一次以向瀏覽器獲取聲音播放權限
            videoResource.play().then(() => {
                videoResource.pause();
                isAudioUnlocked = true;
                console.log("🔊 音訊權限已成功解鎖！");
            }).catch(err => {
                console.warn("音訊解鎖失敗:", err);
            });

            // 隱藏提示層
            audioOverlay.style.display = 'none';
        }

        // 點擊頁面任意位置解鎖聲音
        audioOverlay.addEventListener('click', unlockAudio);

        function setARVideoRatio() {
            if (videoResource.videoWidth > 0 && videoResource.videoHeight > 0) {
                const width = videoResource.videoWidth;
                const height = videoResource.videoHeight;
                const aspectRatio = width / height;

                if (aspectRatio >= 1) {
                    arVideoEntity.setAttribute('width', BASE_SIZE);
                    arVideoEntity.setAttribute('height', BASE_SIZE / aspectRatio);
                } else {
                    arVideoEntity.setAttribute('width', BASE_SIZE * aspectRatio);
                    arVideoEntity.setAttribute('height', BASE_SIZE);
                }
            }
        }

        if (videoResource.readyState >= 1) {
            setARVideoRatio();
        } else {
            videoResource.addEventListener('loadedmetadata', setARVideoRatio);
        }

        targetEntity.addEventListener("targetFound", event => {
            console.log("🎯 識別成功！");
            // 確保開啟聲音並播放
            videoResource.muted = false;
            
            const playPromise = videoResource.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("自動有聲播放被阻擋，嘗試靜音播放作為後備方案方案:", error);
                    videoResource.muted = true;
                    videoResource.play();
                });
            }
        });

        targetEntity.addEventListener("targetLost", event => {
            console.log("❌ 失去識別標籤，暫停影片");
            videoResource.pause();
        });
    </script>
</body>
</html>
