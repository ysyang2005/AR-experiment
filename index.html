<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <title>Timor Leste Kopi Luwak AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Serif+TC:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; 
            background: transparent !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }

        .a-canvas { background-color: transparent !important; }

        /* 啟動遮罩 (點擊僅啟動體驗，不觸發 UI) */
        #audio-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            color: white;
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }
        
        .overlay-btn {
            background: linear-gradient(135deg, #d4af37 0%, #8c681e 100%);
            color: #fff; padding: 16px 36px; border-radius: 30px;
            font-size: 18px; font-weight: bold;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            border: 1px solid #ffe259;
            animation: overlayPulse 2s infinite ease-in-out;
        }

        @keyframes overlayPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* 全屏 UI 覆蓋層 (嚴格預設隱藏) */
        #ar-ui-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            z-index: 1000;
            display: none; 
            justify-content: center; align-items: center;
            pointer-events: none;
            background: transparent;
        }

        #ar-ui-overlay * { pointer-events: auto; }

        .responsive-stage {
            position: relative;
            width: 100vw; height: 100dvh;
            max-width: 500px;
            overflow: hidden;
            pointer-events: none !important;
        }

        #particleCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 15;
            pointer-events: none !important;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        /* 圖片基礎樣式 */
        .placed-image {
            pointer-events: none;
            opacity: 0;
            filter: drop-shadow(0px 0px 8px rgba(255, 215, 0, 0.5));
            will-change: opacity, transform;
        }

        /* 淡入動畫 */
        .anim-fade-in {
            animation: fadeInAnim 0.8s ease-out forwards;
        }
        @keyframes fadeInAnim {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* 1.png 彈性放大跳出 */
        .anim-pop-1 {
            animation: pop1Anim 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes pop1Anim {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
            60% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            100% { opacity: 1; transform: translate(-50%, -50%) rotate(0.87deg) scale(1); }
        }

        /* 頂部標題（兩行獨立打字機） */
        .top-title-container {
            position: absolute;
            top: 3.5%; left: 50%; transform: translateX(-50%);
            z-index: 20; width: 90%; text-align: center;
            pointer-events: none !important;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-line {
            font-family: Impact, "Arial Black", sans-serif;
            font-size: 7.5vw; font-weight: 900; line-height: 0.95;
            letter-spacing: 1px; text-transform: uppercase;
            background: linear-gradient(180deg, #fff3a1 0%, #f7a034 40%, #c43216 80%, #7a1204 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 1px #4a0900;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            opacity: 0;
        }

        .anim-typewriter {
            opacity: 1;
            animation: typing 0.8s steps(12, end) forwards;
        }
        @keyframes typing { from { width: 0; } to { width: 100%; } }

        /* 底部按鈕欄 */
        .bottom-actions-container {
            position: absolute;
            bottom: calc(3.5% + env(safe-area-inset-bottom, 0px));
            left: 50%; transform: translateX(-50%);
            width: 92%; display: flex; justify-content: space-between; align-items: flex-end;
            z-index: 25; opacity: 0;
        }
        .anim-buttons-in {
            animation: buttonsIn 0.6s ease-out forwards;
        }
        @keyframes buttonsIn {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        .action-btn {
            position: relative; width: 31%;
            background: linear-gradient(180deg, #fffef2 0%, #f7e6c4 50%, #e6ca91 100%);
            border: 1.5px solid #d4af37;
            border-radius: 12px; padding: 20px 2px 8px 2px;
            text-align: center; cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
        }

        .btn-badge {
            position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
            width: 28px; height: 28px; border-radius: 50%;
            background: radial-gradient(circle, #1a4d2e 0%, #0d2b19 100%);
            border: 2px solid #f3d085;
            display: flex; justify-content: center; align-items: center;
        }
        .btn-badge svg { width: 14px; height: 14px; fill: #f5e2b3; }
        .btn-text { font-size: 2.3vw; font-weight: bold; color: #3b1d06; white-space: nowrap; }

        /* 圖片點擊回饋 */
        .placed-image {
            cursor: pointer;
            pointer-events: auto;
            transition: filter 0.2s ease;
        }
        .placed-image:active {
            filter: drop-shadow(0px 0px 18px rgba(255, 215, 0, 0.95)) brightness(1.15);
        }

        /* === 資訊彈窗（金色復古風） === */
        #infoModal {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.82);
            width: 86%; max-width: 380px; max-height: 76vh;
            overflow-y: auto;
            background: linear-gradient(180deg, #fffef2 0%, #f7e6c4 50%, #eed9a8 100%);
            border: 2px solid #d4af37;
            border-radius: 18px;
            box-shadow: 0 0 0 1px #8c681e, 0 12px 40px rgba(0,0,0,0.7), 0 0 30px rgba(212,175,55,0.35), inset 0 1px 2px #ffffff;
            padding: 26px 22px 22px;
            color: #3b1d06;
            z-index: 100; opacity: 0; pointer-events: none;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
        }
        #infoModal.active {
            opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto;
        }
        .modal-ornament {
            width: 50px; height: 3px;
            margin: 0 auto 14px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            border-radius: 2px;
        }
        #infoModal h3 {
            font-family: 'Playfair Display', 'Noto Serif TC', serif;
            font-size: 20px; font-weight: 900; line-height: 1.35;
            background: linear-gradient(180deg, #7a1204 0%, #c43216 55%, #8c681e 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .modal-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 13px; font-style: italic;
            color: #8c681e; letter-spacing: 1.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .modal-divider {
            width: 75%; height: 1px;
            margin: 0 auto 14px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
        }
        #infoModal #modalContent {
            font-family: 'Noto Serif TC', 'Cormorant Garamond', serif;
            font-size: 14px; line-height: 1.9;
            color: #3b1d06; text-align: justify;
            font-weight: 400;
            white-space: pre-line;
        }
        .close-modal-btn {
            margin-top: 16px;
            background: radial-gradient(circle, #1a4d2e 0%, #0d2b19 100%);
            color: #f5e2b3;
            border: 1.5px solid #f3d085;
            padding: 8px 30px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Noto Serif TC', serif;
            font-size: 14px; font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .close-modal-btn:active {
            transform: scale(0.95);
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        @media (min-width: 500px) {
            .title-line { font-size: 38px; }
            .btn-text { font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- 點擊開始遮罩 (僅解鎖瀏覽器音訊與鏡頭) -->
    <div id="audio-overlay">
        <div class="overlay-btn">✨ Tap to Begin the Experience ✨</div>
    </div>

    <!-- UI 圖層內容 (未識別前不顯示) -->
    <div id="ar-ui-overlay">
        <div class="responsive-stage" id="stage">
            <canvas id="particleCanvas" class="particles-canvas"></canvas>

            <!-- 兩行獨立標題 -->
            <div class="top-title-container">
                <h1 class="title-line" id="titleLine1">TIMOR LESTE</h1>
                <h1 class="title-line" id="titleLine2">KOPI LUWAK</h1>
            </div>

            <!-- 圖層素材 -->
            <img id="img-7" class="placed-image" src="7.png" style="position: absolute; left: 51.0351%; top: 54.8671%; width: 103.4814%; z-index: 0; transform: translate(-50%, -50%) rotate(0.77deg);" />
            <img id="img-10" class="placed-image" src="10.png" style="position: absolute; left: 16.6111%; top: 44.0888%; width: 51.9053%; z-index: 0; transform: translate(-50%, -50%) rotate(2.55deg);" />
            <img id="img-11" class="placed-image" src="11.png" style="position: absolute; left: 93.9530%; top: 33.6785%; width: 92.9519%; z-index: 0; transform: translate(-50%, -50%) rotate(-11.45deg);" />

            <img id="img-2" class="placed-image" src="2.png" style="position: absolute; left: 13.1054%; top: 63.5387%; width: 50.7775%; z-index: 4; transform: translate(-50%, -50%) rotate(-10.70deg);" />
            <img id="img-3" class="placed-image" src="3.png" style="position: absolute; left: 18.5396%; top: 69.1282%; width: 37.7037%; z-index: 6; transform: translate(-50%, -50%) rotate(-11.34deg);" />
            <img id="img-4" class="placed-image" src="4.png" style="position: absolute; left: 16.6111%; top: 55.7078%; width: 32.9980%; z-index: 2; transform: translate(-50%, -50%) rotate(0.10deg);" />

            <img id="img-5" class="placed-image" src="5.png" style="position: absolute; left: 78.4764%; top: 60.2211%; width: 31.1608%; z-index: 5; transform: translate(-50%, -50%) rotate(0.45deg);" />
            <img id="img-6" class="placed-image" src="6.png" style="position: absolute; left: 78.4764%; top: 64.0202%; width: 39.0327%; z-index: 6; transform: translate(-50%, -50%) rotate(2.36deg);" />
            <img id="img-9" class="placed-image" src="9.png" style="position: absolute; left: 87.4311%; top: 54.8671%; width: 21.5789%; z-index: 2; transform: translate(-50%, -50%) rotate(1.17deg);" />

            <img id="img-1" class="placed-image" src="1.png" style="position: absolute; left: 51.0351%; top: 54.8671%; width: 75%; z-index: 10; transform: translate(-50%, -50%) rotate(0.87deg);" />

            <img id="img-13" class="placed-image" src="13.png" style="position: absolute; left: 87.4311%; top: 12.9671%; width: 30.7334%; z-index: 8; transform: translate(-50%, -50%) rotate(9.84deg);" />
            <img id="img-14-1" class="placed-image" src="14.png" style="position: absolute; left: 16.6111%; top: 23.5930%; width: 24.9709%; z-index: 8; transform: translate(-50%, -50%) rotate(-11.04deg);" />
            <img id="img-14-2" class="placed-image" src="14.png" style="position: absolute; left: 11.1558%; top: 12.3079%; width: 27.3993%; z-index: 8; transform: translate(-50%, -50%) rotate(-3.78deg);" />

            <img id="img-12" class="placed-image" src="12.png" style="position: absolute; left: 47.8179%; top: 76.8301%; width: 93.3333%; z-index: 8; transform: translate(-50%, -50%) rotate(0.87deg);" />

            <div class="bottom-actions-container" id="bottomActions">
                <div class="action-btn" data-info="flavor">
                    <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M12 2C8 2 5 5 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-4-3-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>
                    <div class="btn-text">Flavor Profile</div>
                </div>
                <div class="action-btn" data-info="origin">
                    <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h16V9l-8-6zm0 2.75l5 3.75v8.5H7v-8.5l5-3.75z"/></svg></div>
                    <div class="btn-text">Origin Story</div>
                </div>
                <div class="action-btn" data-info="gift">
                    <div class="btn-badge"><svg viewBox="0 0 24 24"><path d="M17 8C8 10 59 16.17 3.83 12 12 12 3 7 3 2 3 2 5.03 2 7.5 3.5 10 2 12 2 12 2s1.97 0 4.5 1.5C18.97 2 21 2 21 2c0 5-5 9-9 10zm-5 6c-3.31 0-6 2.69-6 6h12c0-3.31-2.69-6-6-6z"/></svg></div>
                    <div class="btn-text">Exclusive Gift</div>
                </div>
            </div>

            <div class="info-modal" id="infoModal">
                <div class="modal-ornament"></div>
                <h3 id="modalTitle">Title</h3>
                <p class="modal-subtitle" id="modalSubtitle"></p>
                <div class="modal-divider"></div>
                <p id="modalContent">Description...</p>
                <button class="close-modal-btn" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- MindAR 場景 -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;" 
             color-space="sRGB" 
             renderer="colorManagement: true, transparent: true, alpha: true" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="ar-target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
        const targetEntity = document.querySelector('#ar-target');
        const audioOverlay = document.querySelector('#audio-overlay');
        const arUiOverlay = document.querySelector('#ar-ui-overlay');
        const particleCanvas = document.getElementById('particleCanvas');
        let animationTimers = [];

        // 點擊遮罩：只負責關閉遮罩，不觸發 UI 動畫
        audioOverlay.addEventListener('click', () => {
            audioOverlay.style.opacity = '0';
            setTimeout(() => {
                audioOverlay.style.display = 'none';
            }, 500);
        });

        // 核心動畫時間線控制器 (僅在 targetFound 時觸發)
        function startSequenceAnimation() {
            animationTimers.forEach(t => clearTimeout(t));
            animationTimers = [];

            // 清除舊動畫狀態
            document.querySelectorAll('.placed-image').forEach(el => {
                el.classList.remove('anim-fade-in', 'anim-pop-1');
                el.style.opacity = '0';
            });
            document.getElementById('titleLine1').classList.remove('anim-typewriter');
            document.getElementById('titleLine2').classList.remove('anim-typewriter');
            document.getElementById('bottomActions').classList.remove('anim-buttons-in');
            particleCanvas.style.opacity = '0';

            // 階段 1: (0.1s) 7, 10, 11 緩緩浮現
            animationTimers.push(setTimeout(() => {
                ['img-7', 'img-10', 'img-11'].forEach(id => document.getElementById(id).classList.add('anim-fade-in'));
            }, 100));

            // 階段 2: (1.0s) 2, 3, 4 浮現
            animationTimers.push(setTimeout(() => {
                ['img-2', 'img-3', 'img-4'].forEach(id => document.getElementById(id).classList.add('anim-fade-in'));
            }, 1000));

            // 階段 3: (1.8s) 5, 6, 9 浮現
            animationTimers.push(setTimeout(() => {
                ['img-5', 'img-6', 'img-9'].forEach(id => document.getElementById(id).classList.add('anim-fade-in'));
            }, 1800));

            // 階段 4: (2.6s) 1.png 放大跳出並回到中央既定位置
            animationTimers.push(setTimeout(() => {
                document.getElementById('img-1').classList.add('anim-pop-1');
            }, 2600));

            // 階段 5: (3.8s) 13, 14 浮現
            animationTimers.push(setTimeout(() => {
                ['img-13', 'img-14-1', 'img-14-2'].forEach(id => document.getElementById(id).classList.add('anim-fade-in'));
            }, 3800));

            // 階段 6: (4.6s) 標題第一行打字機 -> (5.3s) 第二行打字機
            animationTimers.push(setTimeout(() => {
                document.getElementById('titleLine1').classList.add('anim-typewriter');
            }, 4600));

            animationTimers.push(setTimeout(() => {
                document.getElementById('titleLine2').classList.add('anim-typewriter');
            }, 5300));

            // 階段 7: (6.1s) 12.png 浮現
            animationTimers.push(setTimeout(() => {
                document.getElementById('img-12').classList.add('anim-fade-in');
            }, 6100));

            // 階段 8: (6.8s) 底部按鈕彈出
            animationTimers.push(setTimeout(() => {
                document.getElementById('bottomActions').classList.add('anim-buttons-in');
            }, 6800));

            // 階段 9: (7.4s) 降下金色粒子
            animationTimers.push(setTimeout(() => {
                particleCanvas.style.opacity = '1';
            }, 7400));
        }

        // 僅在 MindAR 成功識別圖片時才顯示 UI 並啟動動畫
        targetEntity.addEventListener("targetFound", () => {
            arUiOverlay.style.display = 'flex';
            startSequenceAnimation();
        });

        // 丟失識別時隱藏 UI
        targetEntity.addEventListener("targetLost", () => {
            arUiOverlay.style.display = 'none';
            closeModal();
        });

        // === 統一彈窗控制 ===
        function openModal(data) {
            document.getElementById('modalTitle').innerText = data.title;
            const subtitleEl = document.getElementById('modalSubtitle');
            if (data.subtitle) {
                subtitleEl.innerText = data.subtitle;
                subtitleEl.style.display = 'block';
            } else {
                subtitleEl.style.display = 'none';
            }
            document.getElementById('modalContent').innerText = data.text;
            document.getElementById('infoModal').classList.add('active');
        }
        function closeModal() { document.getElementById('infoModal').classList.remove('active'); }

        // Bottom button info
        const modalData = {
            flavor: { title: "Roasting Notes", subtitle: "Flavor Profile", text: "【Flavor】Dark chocolate's depth, caramel's tenderness, with almond and spice slowly circling in the finish — low acidity, full body, a long letter from mountain and sea written on the tongue.\n【Roast Time】Medium-dark roast recommended. Drop 2–3 minutes after first crack ends. Total roast time approximately 12–14 minutes.\n【Roast Method】Natural-processed beans shine at Full City to Vienna roast — preserving tropical fruit sweetness while unlocking the rich aroma of chocolate and nuts." },
            origin: { title: "Origin Story", subtitle: "Origin Story", text: "In Asia's youngest nation, coffee trees grow on mist-wreathed highlands. Here the civet lives entirely wild, roaming the rainforest freely at night, selecting only the sweetest cherries — never caged, never mistreated. This is the only wild civet coffee program supported by United Nations agencies. Every cup is a dual promise of animal welfare and extraordinary flavor." },
            gift: { title: "Exclusive Gift", subtitle: "Exclusive Gift", text: "Show this screen to redeem a Timor-Leste coffee bean bracelet — each bean baptized by rainforest and time.\nDid you know? Timor-Leste's first coffee began in 1815, when Miguel Arriaga Brum da Silveira of Macau used Macau capital to hire a Brazilian agronomist and bring coffee seeds to Timor's soil.\nA maritime adventure that set sail from Macau begins here. Stay tuned for the \"Macau Adventure\" game — tracing this coffee's two-hundred-year journey." }
        };
        document.querySelectorAll('.action-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const key = btn.getAttribute('data-info');
                if (modalData[key]) openModal(modalData[key]);
            });
        });

        // === Each PNG's relationship with Timor-Leste ===
        const imageInfo = {
            'img-1': {
                title: "The Civet · Soul of Kopi Luwak",
                subtitle: "The Asian Palm Civet",
                text: "In the deep rainforests of Timor-Leste, the civet is a connoisseur of the night. It selects only the ripest cherries, letting the beans undergo a gentle fermentation within. Thus a cup of Kopi Luwak bears the dual imprint of earth and time — what is rare is never the bean, but the night an animal walked through."
            },
            'img-2': {
                title: "Coffee Cherry · Red Gold",
                subtitle: "Coffee Cherry",
                text: "In the season when mountain winds blow, coffee cherries turn from green to red, like little lanterns strung along the branches. The farmer's fingertips gently pluck the reddest one — that is the sweetness brewed by highland mist for a whole year, and the most precious red in Timor-Leste's mountains."
            },
            'img-3': {
                title: "Roasted Beans · The Flavor Code",
                subtitle: "Roasted Beans",
                text: "When beans meet flame, the memory of mountains and forests awakens — dark chocolate's composure, caramel's warmth, nuts' whispers, all slowly blooming within this deep brown little universe. Low acidity is its blank space; full body is its rhyme."
            },
            'img-4': {
                title: "African Drying Bed · Sun-Dried Heritage",
                subtitle: "African Drying Bed",
                text: "Wooden frames are covered with red cherries. Tropical sun passes day by day, wind passes day by day. The farmer turns them with palms, as if stroking a string of time growing sweet. After two to three weeks, the fruit's aroma is locked firmly into every bean."
            },
            'img-5': {
                title: "Clay Pot Coffee · Earth's Warmth",
                subtitle: "Clay Pot Coffee",
                text: "Coffee in the clay pot slowly boils, like a long-overdue conversation. The pores of the earth absorb restlessness, leaving only roundness and warmth. This is how Timorese welcome distant guests — slower, slower still, letting flavor have time to walk into the heart."
            },
            'img-6': {
                title: "Flavor Spectrum · Timor on the Tongue",
                subtitle: "Flavor Notes",
                text: "Almond's whisper, dark chocolate's devotion, caramel's echo — arranged into a slow poem on the tongue. They come from high-altitude mist, from wind on drying beds, from minerals sleeping in volcanic soil — every sip is a distillation of this island nation's natural conditions."
            },
            'img-7': {
                title: "Highland Plantation · Wealth in the Mist",
                subtitle: "Highland Plantation",

        // 為每張 PNG 綁定點擊彈窗
        document.querySelectorAll('.placed-image').forEach(img => {
            img.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = img.id;
                if (imageInfo[id]) openModal(imageInfo[id]);
            });
        });

        // 金色粒子
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const stage = document.getElementById('stage');
        let width, height;

        function resizeCanvas() {
            width = stage.clientWidth;
            height = stage.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class GoldParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = -10;
                this.size = Math.random() * 2.5 + 1;
                this.speedY = Math.random() * 1.5 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.8 + 0.2;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y > height + 10) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const particles = Array.from({ length: 35 }, () => new GoldParticle());
        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
